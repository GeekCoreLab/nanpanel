apiVersion: v1
kind: ServiceAccount
metadata:
  name: p5-prometheus
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: p5-prometheus
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: p5-prometheus
  namespace: default
subjects:
  - kind: ServiceAccount
    name: p5-prometheus
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: p5-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: p5-demo-stable
  namespace: default
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: p5-demo
---
apiVersion: v1
kind: Service
metadata:
  name: p5-demo-canary
  namespace: default
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: p5-demo
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p5-demo
  namespace: default
spec:
  parentRefs:
    - name: eg
  hostnames:
    - p5.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: p5-demo-stable
          port: 8080
          weight: 100
        - name: p5-demo-canary
          port: 8080
          weight: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p5-prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p5-prometheus
  template:
    metadata:
      labels:
        app: p5-prometheus
    spec:
      serviceAccountName: p5-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: p5-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    app: p5-prometheus
