syntax = "proto3";
package nanpanel.agent.v1;

option java_package = "io.nanpanel.agent.protocol.v1";
option java_multiple_files = true;

service AgentGateway {
  rpc Session(stream AgentMessage) returns (stream ControlMessage);
}

service ControlRelay {
  rpc AgentSession(stream AgentMessage) returns (stream RelayMessage);
  rpc CoreSession(stream CoreMessage) returns (stream RelayMessage);
}

message AgentMessage {
  string agent_id = 1;
  uint64 sequence = 2;
  int64 sent_at_epoch_ms = 3;
  oneof payload {
    Heartbeat heartbeat = 4;
    OperationResult operation_result = 5;
  }
}

message Heartbeat {
  string version = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  repeated string capabilities = 5;
  string helper_status = 6;
  repeated SystemdService systemd_services = 7;
  int64 systemd_observed_at_epoch_ms = 8;
  repeated NetworkInterface network_interfaces = 9;
  repeated NetworkRoute network_routes = 10;
  int64 network_observed_at_epoch_ms = 11;
  NetbirdOverlaySummary netbird_overlay = 12;
  int64 netbird_overlay_observed_at_epoch_ms = 13;
  repeated NetbirdPeerPath netbird_peer_paths = 14;
  int64 netbird_peer_paths_observed_at_epoch_ms = 15;
  KubernetesRuntimeDiscovery kubernetes_runtime = 16;
}

message KubernetesRuntimeDiscovery {
  bool detected = 1;
  bool kubelet_running = 2;
  bool api_server_local = 3;
  string runtime_kind = 4;
  int64 observed_at_epoch_ms = 5;
}

message NetbirdOverlaySummary {
  uint32 peer_count = 1;
  uint32 connected_peer_count = 2;
  uint32 p2p_peer_count = 3;
  uint32 relayed_peer_count = 4;
}

message NetbirdPeerPath {
  string peer_name = 1;
  string status = 2;
  string connection_type = 3;
}

message SystemdService {
  string unit_name = 1;
  string display_name = 2;
  string active_state = 3;
  string sub_state = 4;
  reserved 5, 6;
  reserved "restart_allowed", "journal_read_allowed";
}

message NetworkInterface {
  string name = 1;
  string mac_address = 2;
  uint32 mtu = 3;
  string state = 4;
  repeated NetworkAddress addresses = 5;
}

message NetworkAddress {
  string family = 1;
  string address = 2;
  uint32 prefix_length = 3;
  string scope = 4;
}

message NetworkRoute {
  string destination = 1;
  string gateway = 2;
  string interface_name = 3;
  string protocol = 4;
  string scope = 5;
  string route_type = 6;
  string table = 7;
  uint32 metric = 8;
}

message OperationResult {
  string operation_id = 1;
  string idempotency_key = 2;
  string status = 3;
  string detail = 4;
}

message ControlMessage {
  string operation_id = 1;
  string idempotency_key = 2;
  string capability = 3;
  string target = 4;
  int64 deadline_epoch_ms = 5;
  bool operation_result_ack = 6;
  string payload_json = 7;
}

message CoreMessage {
  oneof payload {
    RelayCoreHello hello = 1;
    RelayControl control = 2;
    RelayAcknowledge acknowledge = 3;
    RelayAgentAuthorization agent_authorization = 4;
  }
}

message RelayCoreHello {
  string cluster_id = 1;
  uint64 epoch = 2;
}

message RelayControl {
  string agent_id = 1;
  ControlMessage control = 2;
}

message RelayAcknowledge {
  string agent_id = 1;
  string operation_id = 2;
  string idempotency_key = 3;
}

message RelayAgentAuthorization {
  string agent_id = 1;
  string certificate_fingerprint = 2;
  bool allowed = 3;
}

message RelayMessage {
  oneof payload {
    RelayHelloAck hello_ack = 1;
    RelayedAgentMessage agent_message = 2;
    ControlMessage control = 3;
  }
}

message RelayHelloAck {
  string relay_id = 1;
  string cluster_id = 2;
  uint64 core_epoch = 3;
  uint32 max_frame_bytes = 4;
}

message RelayedAgentMessage {
  string agent_id = 1;
  string certificate_fingerprint = 2;
  AgentMessage message = 3;
}
