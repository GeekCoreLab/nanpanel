syntax = "proto3";
package nanpanel.agent.v1;
option java_package = "io.nanpanel.agent.protocol.v1";
option java_multiple_files = true;
// Draft only: mTLS identity binding, replay checks and enrollment remain to implement.
service AgentGateway { rpc Connect(stream AgentMessage) returns (stream ControlMessage); }
message AgentMessage { string agent_id = 1; uint64 sequence = 2; int64 sent_at_epoch_ms = 3; }
message ControlMessage { string operation_id = 1; string idempotency_key = 2; string capability = 3; int64 deadline_epoch_ms = 4; }
