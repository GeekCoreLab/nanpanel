apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanpanel-topology-inventory
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanpanel-topology-inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nanpanel-topology-inventory
subjects:
  - kind: ServiceAccount
    name: nanpanel-core
    namespace: nanpanel
