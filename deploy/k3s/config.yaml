apiVersion: v1
kind: ConfigMap
metadata:
  name: nanpanel-config
  namespace: nanpanel
data:
  DB_USER: nanpanel
  DB_URL: jdbc:postgresql://nanpanel-postgres:5432/nanpanel
  QUARKUS_HTTP_HOST: 0.0.0.0
  NANPANEL_ORIGIN: https://__NANPANEL_TLS_HOST__:30443
  NANPANEL_AUTH_SECURE_COOKIE: "true"
  NANPANEL_AGENT_GATEWAY_PORT: "30444"
  NANPANEL_AGENT_RELAY_FALLBACK_ENDPOINTS: disabled
  NANPANEL_AGENT_RELAY_SIGNING_PRIVATE_KEY: /etc/nanpanel/relay-signing/key.pem
  NANPANEL_AGENT_RELAY_SIGNING_PUBLIC_KEY: disabled
  NANPANEL_KUBERNETES_DISCOVERY_ENABLED: "false"
  NANPANEL_KUBERNETES_CLUSTER_ID: k3s-1
  NANPANEL_KUBERNETES_NAMESPACE: nanpanel-mesh
  NANPANEL_KUBERNETES_SERVICE_PROBES_ENABLED: "false"
