apiVersion: v1
kind: Service
metadata:
  name: nanpanel-postgres-headless
  namespace: nanpanel
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nanpanel-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: nanpanel-postgres
  namespace: nanpanel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nanpanel-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nanpanel-postgres
  namespace: nanpanel
spec:
  serviceName: nanpanel-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nanpanel-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanpanel-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nanpanel
            - name: POSTGRES_USER
              value: nanpanel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nanpanel-db
                  key: DB_PASSWORD
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
