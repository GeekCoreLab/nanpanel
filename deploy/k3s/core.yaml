apiVersion: v1
kind: Service
metadata:
  name: nanpanel-core
  namespace: nanpanel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nanpanel-core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanpanel-core
  namespace: nanpanel
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nanpanel-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanpanel-core
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          command:
            - sh
            - -c
            - until pg_isready -h nanpanel-postgres -p 5432 -U nanpanel -d nanpanel; do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nanpanel-db
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: core
          image: ghcr.io/geekcorelab/nanpanel-core:__NANPANEL_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: nanpanel-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nanpanel-db
                  key: DB_PASSWORD
            - name: NANPANEL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nanpanel-admin-bootstrap
                  key: NANPANEL_ADMIN_PASSWORD
                  optional: true
            - name: NANPANEL_AGENT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanpanel-agent-gateway
                  key: NANPANEL_AGENT_GATEWAY_TOKEN
            - name: NANPANEL_AGENT_CA_CERT
              value: /etc/nanpanel/agent-ca/ca.crt
            - name: NANPANEL_AGENT_CA_KEY
              value: /etc/nanpanel/agent-ca/ca.key
            - name: NANPANEL_AGENT_SERVING_CERT
              value: /etc/nanpanel/agent-serving/tls.crt
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: agent-ca-signing
              mountPath: /etc/nanpanel/agent-ca
              readOnly: true
            - name: agent-serving-cert
              mountPath: /etc/nanpanel/agent-serving
              readOnly: true
        - name: agent-gateway
          image: ghcr.io/geekcorelab/nanpanel-core:__NANPANEL_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          command: ["/work/nanpanel-agent", "gateway"]
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: NANPANEL_GATEWAY_LISTEN
              value: 0.0.0.0:50051
            - name: NANPANEL_GATEWAY_CONTROL_LISTEN
              value: 127.0.0.1:50052
            - name: NANPANEL_GATEWAY_CLIENT_CA
              value: /etc/nanpanel/agent-ca/ca.crt
            - name: NANPANEL_GATEWAY_CERT
              value: /etc/nanpanel/agent-serving/tls.crt
            - name: NANPANEL_GATEWAY_KEY
              value: /etc/nanpanel/agent-serving/tls.key
            - name: NANPANEL_GATEWAY_CALLBACK_URL
              value: http://127.0.0.1:8080/internal/agent-heartbeats
            - name: NANPANEL_GATEWAY_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanpanel-agent-gateway
                  key: NANPANEL_AGENT_GATEWAY_TOKEN
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: agent-ca-trust
              mountPath: /etc/nanpanel/agent-ca
              readOnly: true
            - name: agent-serving-keypair
              mountPath: /etc/nanpanel/agent-serving
              readOnly: true
            - name: relay-fallback-signing-key
              mountPath: /etc/nanpanel/relay-signing
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: agent-ca-signing
          secret:
            secretName: nanpanel-agent-ca
            defaultMode: 0440
        - name: agent-ca-trust
          secret:
            secretName: nanpanel-agent-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
        - name: agent-serving-cert
          secret:
            secretName: nanpanel-web-tls
            items:
              - key: tls.crt
                path: tls.crt
            defaultMode: 0444
        - name: agent-serving-keypair
          secret:
            secretName: nanpanel-web-tls
            defaultMode: 0440
        - name: relay-fallback-signing-key
          secret:
            secretName: nanpanel-relay-signing
            optional: true
            defaultMode: 0440
            items:
              - key: RELAY_FALLBACK_PRIVATE_KEY
                path: key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: nanpanel-agent-gateway
  namespace: nanpanel
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nanpanel-core
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: grpc
      nodePort: 30444
