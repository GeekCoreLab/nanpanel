apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nanpanel-application-network-runtime
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nanpanel-application-network-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nanpanel-application-network-runtime
subjects:
  - kind: ServiceAccount
    name: nanpanel-core
    namespace: nanpanel
