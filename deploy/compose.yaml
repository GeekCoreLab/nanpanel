services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: nanpanel
      POSTGRES_USER: ${DB_USER:-nanpanel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d nanpanel"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
