apiVersion: v1
kind: Namespace
metadata:
  name: nanpanel-mesh
  labels:
    app.kubernetes.io/part-of: nanpanel
    istio-injection: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-http-content
  namespace: nanpanel-mesh
data:
  index.html: "NANPANEL_ISTIO_MESH_READY\n"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-client
  namespace: nanpanel-mesh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-http
  namespace: nanpanel-mesh
  labels:
    app: mesh-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-http
  template:
    metadata:
      labels:
        app: mesh-http
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: docker.1ms.run/library/busybox:1.37.0
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: content
              mountPath: /www
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: mesh-http-content
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-http
  namespace: nanpanel-mesh
spec:
  selector:
    app: mesh-http
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-client
  namespace: nanpanel-mesh
  labels:
    app: mesh-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-client
  template:
    metadata:
      labels:
        app: mesh-client
    spec:
      serviceAccountName: mesh-client
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: docker.1ms.run/curlimages/curl:8.12.1
          command: ["/bin/sh", "-c", "sleep 365d"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-denied-client
  namespace: nanpanel-mesh
  labels:
    app: mesh-denied-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-denied-client
  template:
    metadata:
      labels:
        app: mesh-denied-client
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: docker.1ms.run/curlimages/curl:8.12.1
          command: ["/bin/sh", "-c", "sleep 365d"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: namespace-strict-mtls
  namespace: nanpanel-mesh
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-http-allow-client
  namespace: nanpanel-mesh
spec:
  selector:
    matchLabels:
      app: mesh-http
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/nanpanel-mesh/sa/mesh-client
      to:
        - operation:
            ports: ["8080"]
