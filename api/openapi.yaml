      description: 支持软件包安装、受保护文件写入、Docker/Podman 容器操作、临时防火墙规则和主机文件浏览/读写/删除。Helper 校验固定操作类型和参数；不提供任意 Shell。映射到 Kubernetes Node 的主机拒绝 Agent 容器操作，容器生命周期归 Kubernetes/Kubelet/KubeEdge 管理，但 OS 与网络诊断仍可用。文件管理拒绝 .、.. 和符号链接路径组件，只读取 UTF-8 普通文件（最多 64 KiB），写入最多 32 KiB，删除仅针对普通文件；目录列表最多 200 项。读取的文件内容会出现在 Operation 结果中并留在持久化任务记录里。Core 检查主机版本、Agent 能力、在线状态和 Helper 状态；结果通过 durable Operation 回传。
