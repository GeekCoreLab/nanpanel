          format: uuid
        action:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1
        resourceId:
          type:
          - string
          - 'null'
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - DENIED
          - FAILED
          - ACCEPTED
          - UNKNOWN
        traceId:
          type: string
          minLength: 1
        clientIp:
          type:
          - string
          - 'null'
        summary:
          type: string
          minLength: 1
    AdminOverview:
