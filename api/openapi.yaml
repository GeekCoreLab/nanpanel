openapi: 3.1.1
info:
  title: NaNPanel 管理 API
  version: 0.1.0-draft.2
  description: 契约优先的 Web 平台 API。管理操作使用 HttpOnly Cookie 会话和写请求 CSRF；短期 API 密钥仅授权明确列出的 Kubernetes 服务网络接口。Kubernetes 集群由管理员显式导入单一 kubeconfig context，集群凭据按 AES-GCM 加密存储且不在 API 响应中回显。Agent 使用独立的一次性接入码、客户端证书和 mTLS/gRPC。主机资产保存 AES-GCM 加密的 SSH 密码或私钥，确认 host key 后可固定安装 Agent，并可开启经一次性 WebSocket 票据授权的交互式 SSH 堡垒 Shell；会话、命令行和有界终端录像独立持久化。Helper 暴露固定类型操作并校验输入参数、目标路径和运行条件；Core 使用用户权限、主机身份校验、审计及幂等任务管理控制操作。不接收任意 Helper 命令。Agent 安装时签名的故障切换端点清单已实现；真实 DNS/故障验收仍待完成。
  x-status: draft
servers:
- url: http://127.0.0.1:8080
  description: 本地 Core（认证、平台管理、inventory 查询与仪表盘统计已实现）。
security:
- cookieAuth: []
tags:
- name: System
  description: 主控基本信息
- name: Hosts
  description: 主机资产与管理通道状态
- name: Agents
  description: Rust Agent 会话与能力
- name: SystemServices
  description: 主机 systemd 服务管理
- name: SshAccess
  description: 基于主机资产 SSH 配置执行的固定探测与 systemd 操作
- name: SshBastion
  description: 主机资产 SSH 凭据、host key 信任和可审计堡垒终端
- name: Operations
  description: 持久化异步操作与结果
- name: Auth
  description: Web 登录、当前身份、密码、本人会话与受限 API 密钥
- name: AdminOverview
  description: 管理仪表盘
- name: AdminUsers
  description: 平台管理员账号，首期仅内置 ADMIN 角色
- name: AdminRoles
  description: 只读内置角色与权限
- name: AdminSettings
  description: 非机密平台设置
- name: AdminAudit
  description: 只读脱敏审计
- name: Topology
  description: 拓扑期望草稿，不部署网络
- name: ServiceNetwork
  description: Kubernetes Service 与 EndpointSlice 只读清单
- name: KubernetesClusters
  description: 独立 Kubernetes 集群登记、健康观测和节点资产映射
- name: NetworkProviders
  description: 管理端网络 Provider 计划、变更、验证与补偿
paths:
  /api/v1/kubernetes/installations:
    get:
      tags: [KubernetesClusters]
      operationId: listK3sInstallations
      summary: 查询当前管理员创建的 K3s 多节点安装计划
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 最近创建的安装计划，不包含令牌。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sInstallationList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KubernetesClusters]
      operationId: createK3sInstallation
      summary: 创建一个未启动的 K3s 多节点首次安装计划
      description: 创建时令牌仅用于加密存储；启动后先安装 Server，等待管理员导入集群并映射 Server Node，再串行安装 Agent。每个 Agent 需映射到 Ready Node 后才会继续。计划不会覆盖已有 K3s 文件。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/K3sInstallationCreateRequest' }
      responses:
        '201':
          description: 已保存为 DRAFT 的安装计划。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sInstallationPlan' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 主机在线状态、Helper 能力或管理状态不满足安全前置条件。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/kubernetes/installations/{planId}:
    parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    get:
      tags: [KubernetesClusters]
      operationId: getK3sInstallation
      summary: 查询安装计划与主机步骤
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 计划状态和逐主机安装步骤，不包含令牌。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sInstallationPlan' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kubernetes/installations/{planId}/start:
    parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    post:
      tags: [KubernetesClusters]
      operationId: startK3sInstallation
      summary: 显式启动草稿安装计划
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      responses:
        '202':
          description: 计划已启动，后续由持久化调度器串行推进。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sInstallationPlan' }
        '409':
          description: 主机状态或计划状态不满足启动条件。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/kubernetes/installations/{planId}/register-cluster:
    parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    post:
      tags: [KubernetesClusters]
      operationId: registerK3sInstallationCluster
      summary: 关联已导入且映射 Server Node 的 K3s 集群并继续 Agent 安装
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clusterId]
              properties:
                clusterId: { type: string, format: uuid }
      responses:
        '200':
          description: Server Node 映射已验证，Agent 步骤已解锁。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sInstallationPlan' }
        '409':
          description: 集群尚未导入、健康或映射到计划的 Server 主机。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/kubernetes/rollouts:
    get:
      tags: [KubernetesClusters]
      operationId: listK3sRollouts
      summary: 查询当前管理员创建的 K3s 升级计划
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 最近创建的升级计划。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sRolloutList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KubernetesClusters]
      operationId: createK3sRollout
      summary: 创建一个未启动的 K3s 逐节点升级计划
      description: 刷新并检查集群所有 Node、Host 映射、Agent 在线状态、Helper 能力和版本兼容性。创建计划不会执行升级；管理员必须显式启动。计划按 server 后 agent 排序，每次只提交一个节点，并在每步后要求所有 Node Ready。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/K3sRolloutCreateRequest' }
      responses:
        '201':
          description: 已保存为 DRAFT 的升级计划。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sRolloutPlan' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 集群状态、Node、Agent、Helper 能力或版本不满足安全前置条件。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/kubernetes/rollouts/{planId}:
    parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    get:
      tags: [KubernetesClusters]
      operationId: getK3sRollout
      summary: 查询升级计划与节点步骤
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 升级计划状态与按序执行的 Node 步骤。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sRolloutPlan' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kubernetes/rollouts/{planId}/start:
    parameters:
    - name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    post:
      tags: [KubernetesClusters]
      operationId: startK3sRollout
      summary: 显式启动草稿升级计划
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      responses:
        '202':
          description: 计划已启动，后续步骤由 Core 持久化调度器推进。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/K3sRolloutPlan' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 计划不是 DRAFT 状态，或同一集群已有运行计划。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/kubernetes/clusters:
    get:
      tags: [KubernetesClusters]
      operationId: listKubernetesClusters
      summary: 查询已登记 Kubernetes 集群
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 集群元数据和最近一次健康观测，不含集群凭据。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KubernetesClusters]
      operationId: importKubernetesCluster
      summary: 使用单一 kubeconfig context 导入集群
      description: 仅管理员 Cookie 会话可调用；写请求需要 CSRF。拒绝 exec/auth-provider、外部凭据文件、跳过 TLS 校验和非 HTTPS API。导入前验证 Namespace 与 Node 列表权限；凭据加密后存储，响应不回显 kubeconfig。Bearer API 密钥不可调用。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesClusterImportRequest'
      responses:
        '201':
          description: 集群已验证并登记。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 所选 context 没有读取 Namespace 与 Node 清单的 RBAC 权限。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 集群名称已登记。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: kubeconfig/context 无效，或 Kubernetes API 拒绝所选凭据。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Kubernetes API 不可达。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 集群凭据加密密钥未配置。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/kubernetes/discoveries:
    get:
      tags: [KubernetesClusters]
      operationId: listKubernetesRuntimeDiscoveries
      summary: 查询 Agent 自动发现的 Kubernetes 主机
      description: 返回 Agent 报告为运行 kubelet/K3s 的主机。发现记录不包含 kubeconfig，单凭检测结果不会授权 Core 访问集群 API。若启用本地 K3s 自动纳管，且 Agent 报告的主机是 Core 所在 K3s 集群中 Ready 的 API Server Node，Core 可使用自身只读集群内身份登记该集群并映射该 Host；其他发现仍需管理员导入并验证集群凭据，远程 Agent 凭据签发与轮换尚未实现。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 最近检测到 Kubernetes runtime 的主机列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesRuntimeDiscoveryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/kubernetes/clusters/{clusterId}:
    parameters:
    - name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags: [KubernetesClusters]
      operationId: getKubernetesCluster
      summary: 查询已登记集群状态
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 集群元数据和最近一次健康观测。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesClusterSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/kubernetes/clusters/{clusterId}/topology/namespaces:
    parameters:
    - name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags: [KubernetesClusters]
      operationId: listImportedClusterTopologyNamespaces
      summary: 读取已登记集群的 Namespace 清单
      description: 使用该集群加密保存的 kubeconfig 只读查询 Namespace；读取失败不会阻止 Host Agent 诊断。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 该集群的 Namespace 清单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesTopologyNamespaceSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: 集群凭据缺少读取 Namespace 的权限。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: 集群 API 不可用或已保存的凭据被拒绝。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/kubernetes/clusters/{clusterId}/topology/namespaces/{namespace}:
    parameters:
    - name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: namespace
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    get:
      tags: [KubernetesClusters]
      operationId: getImportedClusterTopologyNamespace
      summary: 读取已登记集群的 Namespace 资源
      description: 返回只读 Ingress、Service、Pod 和容器快照；不执行 Kubernetes 写操作。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Namespace 工作负载快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesTopologyNamespaceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: 集群凭据缺少读取 Namespace 资源的权限。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: 集群 API 不可用或已保存的凭据被拒绝。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/kubernetes/clusters/{clusterId}/namespaces/{namespace}/deployments:
    parameters:
    - name: clusterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: namespace
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    get:
      tags: [KubernetesClusters]
      operationId: listManagedKubernetesDeployments
      summary: 列出 Namespace 中由 NaNPanel 管理的 Deployment
      description: 仅读取控制面记录的 Deployment，并按 Kubernetes UID 和所有权标记校验；不管理其他对象。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 托管 Deployment 当前状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubernetesManagedDeploymentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 集群凭据缺少 Namespace 内 Deployment get 权限。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: 集群 API 不可用或已保存的凭据被拒绝。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [KubernetesClusters]
      operationId: createManagedKubernetesDeployment
      summary: 创建受限参数的托管 Deployment
      description: 只接受镜像、单容器端口和 1–20 个副本；写入集群前后均限定在路径中的 Namespace。其他 Deployment 不可被接管。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KubernetesManagedDeploymentCreateRequest' }
      responses:
        '201':
          description: Deployment 已创建并记录所有权。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KubernetesManagedDeployment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 集群凭据缺少 Namespace 内 Deployment create 权限。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Deployment 名称已被使用或控制面已有相同资源记录。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 请求字段或资源上限无效。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: 集群 API 不可用或已保存的凭据被拒绝。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: 集群已创建资源，但控制面未能持久化其所有权记录。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/kubernetes/clusters/{clusterId}/namespaces/{namespace}/deployments/{name}/scale:
    parameters:
    - name: clusterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: namespace
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    - name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    put:
      tags: [KubernetesClusters]
      operationId: scaleManagedKubernetesDeployment
      summary: 调整托管 Deployment 副本数
      description: 只允许更新数据库登记且 UID、所有权标记均匹配的 Deployment；副本数限制为 0–20。
      x-implementation-status: implemented
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KubernetesManagedDeploymentScaleRequest' }
      responses:
        '200':
          description: 更新后的 Deployment 状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KubernetesManagedDeployment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 集群凭据缺少 Deployment scale 子资源 update 权限。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前 Deployment 的身份或所有权标记已变化。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 副本数无效。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: 集群 API 不可用或已保存的凭据被拒绝。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/kubernetes/clusters/{clusterId}/namespaces/{namespace}/deployments/{name}:
    parameters:
    - name: clusterId
      in: path
      required: true
