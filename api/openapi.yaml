          description: 不可变 Revision 内容。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/agent-installation:
    get:
      tags: [Agents]
      operationId: getAgentInstallation
      summary: 查询 Agent 安装信息
      description: 返回公开的控制器 TLS SHA-256 指纹、Gateway NodePort 和静态安装入口，不返回机密。
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Agent 安装信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallation'
  /api/v1/agent-controller-cert:
    get:
      tags: [Agents]
      operationId: downloadAgentControllerCertificate
      summary: 下载控制器 TLS 证书
      description: 安装引导使用预先展示的 SHA-256 指纹校验证书，再用其验证后续 HTTPS 请求。
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: PEM 编码的控制器 TLS 证书。
          content:
            application/x-pem-file:
              schema:
                type: string
                format: binary
  /api/v1/agent-download/linux-amd64:
    get:
      tags: [Agents]
      operationId: downloadLinuxAmd64Agent
      summary: 下载 Linux x86_64 Agent
      description: 获取与当前 Core 镜像一同发布的 Rust Agent。
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Linux ELF Agent 可执行文件。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/agent-enrollments:
    post:
      tags: [Agents]
      operationId: createAgentEnrollment
      summary: 创建一次性 Agent 接入码
      description: 创建 UNKNOWN 主机资产和待接入 Agent。接入码仅返回一次，15 分钟后过期，首次兑换后立即失效。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentEnrollmentRequest'
      responses:
        '201':
          description: 新主机资产及一次性接入信息。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollmentCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/agent-enrollments/redeem:
    post:
      tags: [Agents]
      operationId: redeemAgentEnrollment
      summary: 使用一次性接入码兑换客户端证书
      description: 安装器提交本机生成的 Agent CSR；Core 验证 CSR CN 与预登记 Agent UUID 相同后签发客户端证书。
      x-implementation-status: implemented
      security:
        - agentEnrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemAgentEnrollmentRequest'
      responses:
        '200':
          description: 一次性接入码兑换成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollmentRedeemed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 仅供当前脚手架 GET /api/v1/system 兼容；不是 Web 登录方案。其余规划接口不接受 Basic 作为会话替代。
    cookieAuth:
      type: apiKey
      in: cookie
      name: nanpanel_session
      description: 服务端保存的随机不透明会话；Secure、HttpOnly、SameSite=Lax、Path=/，不设置 Domain。生产仅 HTTPS；具体预认证/登录/续期语义见 API README。
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: NaNPanel API key
      description: 管理员通过 /api/v1/auth/api-keys 创建的受限密钥。仅支持明确授权的 Kubernetes 服务网络接口；短期有效，可撤销，服务端只保存摘要。
    preAuthCookie:
      type: apiKey
      in: cookie
      name: nanpanel_session
      description: GET /auth/csrf 签发的短期预认证 Cookie，不能访问管理资源；登录时必须与 CSRF token 配对。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 与 Cookie 绑定的同步 CSRF token；所有 POST/PUT/PATCH/DELETE 都要求验证，登录也不例外。
    agentEnrollmentToken:
      type: http
      scheme: bearer
      description: 15 分钟有效且只能兑换一次的安装器接入码，不用于浏览器管理会话。
  parameters:
    HostId:
      name: hostId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 按资源 UUID 升序游标分页。
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: 不透明游标，与调用者授权范围和筛选条件绑定。无效或筛选不匹配返回 400。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: 调用者为一次逻辑操作生成的唯一键。按认证主体 + HTTP 方法 + 规范化路径 + 此键去重；规范化请求体和 If-Match 必须一致。任务及去重记录保留至少 7 天，非终态记录不得提前删除。
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[A-Za-z0-9._:-]{1,200}"$
        examples:
        - '"svc7-obs42-admin"'
      description: 服务详情返回的不透明强 ETag（带双引号）；标识当前调用者可见的完整表示，观测或权限提示变化也会使其改变，不接受通配符或多个值。新任务版本过期返回 412，缺失返回 428；同一幂等请求重放优先匹配原记录。
    ResourceIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[A-Za-z0-9._:-]{1,200}"$
        examples:
        - '"user-v3-admin"'
      description: 对应资源详情的强 ETag。与当前完整表示比较；缺失 428、过期 412，不允许 * 或多个 ETag。
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditEventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: 当前调用者可见的完整资源表示对应的不透明强 ETag；服务、用户与设置均独立生成，不等同于 generation。
      schema:
        type: string
        examples:
        - '"svc7-obs42-admin"'
    Location:
      description: 操作资源的相对 URI。
      schema:
        type: string
        format: uri-reference
        examples:
        - /api/v1/operations/559903dd-6474-4cb1-a70d-3e0ade987442
    RetryAfter:
      description: 建议下次轮询/重试等待的秒数。
      schema:
        type: integer
        minimum: 1
        examples:
        - 2
    IdempotencyReplayed:
      description: true 表示返回原操作，没有再次执行。
      schema:
        type: boolean
    SessionCookie:
      description: 签发/轮换 HttpOnly Cookie；退出时以相同 Path/属性置空并设 Max-Age=0。仅示意，不是真实凭据。
      schema:
        type: string
        examples:
        - nanpanel_session=example-not-a-real-session; Path=/; Secure; HttpOnly; SameSite=Lax
    NoStore:
      description: 认证和管理响应不缓存。
      schema:
        type: string
        const: no-store
  schemas:
    TopologyNodeKind:
      type: string
      enum:
      - GATEWAY
      - HOST
      - ROUTER
      - SERVICE
      - SWITCH
      - MERGE
      - SPLIT
      - FORWARDER
      - FOLDER
    TopologyPosition:
      type: object
      additionalProperties: false
      required:
      - x
      - y
      properties:
        x:
          type: number
          minimum: -10000
          maximum: 10000
        y:
          type: number
          minimum: -10000
          maximum: 10000
    TopologyLayer:
      type: string
      enum: [L2, L3, L4, L7]
    TopologyProtocol:
      type: string
      enum: [ETHERNET, IP, TCP, UDP, SCTP, HTTP, HTTPS]
    TopologyPort:
      type: object
      additionalProperties: false
      required: [id, direction, layer, protocols]
      properties:
        id:
          type: string
          pattern: ^(in|out)-([1-9]|1[0-6])$
        direction:
          type: string
          enum: [INPUT, OUTPUT]
        layer:
          $ref: '#/components/schemas/TopologyLayer'
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TopologyProtocol'
    TopologyNode:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - position
      - inputCount
      - outputCount
      - ports
      properties:
        id: &id001
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TopologyNodeKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        position:
          $ref: '#/components/schemas/TopologyPosition'
        inputCount:
          type: integer
          minimum: 0
          maximum: 16
        outputCount:
          type: integer
          minimum: 0
          maximum: 16
        ports:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/TopologyPort'
        parentId:
          type: [string, 'null']
          format: uuid
          description: Parent folder ID; null means the outermost topology.
        assetId:
          type: [string, 'null']
          format: uuid
          description: Registered host ID for HOST or GATEWAY nodes linked to a host asset.
        clusterId:
          type: [string, 'null']
          format: uuid
          description: Registered Kubernetes cluster ID for a FOLDER node.
        ipAddress:
          type: [string, 'null']
          maxLength: 45
          description: Static IPv4/IPv6 address used by a ROUTER node for next-hop matching.
    TopologyLink:
      type: object
      additionalProperties: false
      required:
      - id
      - sourceNodeId
      - sourcePort
      - targetNodeId
      - targetPort
      - layer
      - protocol
      - status
      properties:
        id: *id001
        sourceNodeId: *id001
        sourcePort:
          type: string
          pattern: ^out-([1-9]|1[0-6])$
        targetNodeId: *id001
        targetPort:
          type: string
          pattern: ^in-([1-9]|1[0-6])$
        layer:
          $ref: '#/components/schemas/TopologyLayer'
        protocol:
          $ref: '#/components/schemas/TopologyProtocol'
        status:
          type: string
          const: UNVERIFIED
        state:
          type: string
          enum: [PENDING, VERIFIED, ERROR, UNSUPPORTED]
          readOnly: true
    TopologyDraftWrite:
      type: object
      additionalProperties: false
      required:
      - nodes
      - links
      properties:
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TopologyNode'
        links:
          type: array
          maxItems: 800
          items:
            $ref: '#/components/schemas/TopologyLink'
    TopologyDraft:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - generation
      - nodes
      - links
      - updatedAt
      - updatedBy
      properties:
        revisionId:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 0
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TopologyNode'
        links:
          type: array
          maxItems: 800
          items:
            $ref: '#/components/schemas/TopologyLink'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type:
          - string
          - 'null'
          format: uuid
    TopologyRevisionSummary:
      type: object
      additionalProperties: false
      required: [revisionId, generation, nodeCount, linkCount, updatedAt, updatedBy]
      properties:
        revisionId:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 0
        nodeCount:
          type: integer
          minimum: 0
        linkCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type:
          - string
          - 'null'
          format: uuid
    SystemInfo:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - stage
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        stage:
          type: string
          minLength: 1
    Host:
      type: object
      additionalProperties: false
      required:
      - id
      - hostname
      - os
      - arch
      - status
      - capabilities
      - agentId
      - lastSeenAt
      - createdAt
      - generation
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
          minLength: 1
        os:
          type:
          - string
          - 'null'
        arch:
          type:
          - string
          - 'null'
        generation:
          type: integer
          format: int64
          minimum: 1
          description: 平台配置代次；提交 Helper 操作时必须回传，防止基于过期能力快照执行。
        status:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
          description: Agent 管理通道状态，不表示业务数据面健康。
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
        agentId:
          type:
          - string
          - 'null'
          format: uuid
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    HostNetworkInventory:
      type: object
      additionalProperties: false
      required: [interfaces, routes, observedAt, overlay, overlayPeers, overlayPeersObservedAt]
      properties:
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/HostNetworkInterface'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/HostNetworkRoute'
        observedAt:
          type: [string, 'null']
          format: date-time
        overlay:
          oneOf:
            - $ref: '#/components/schemas/HostOverlayInventory'
            - type: 'null'
        overlayPeers:
          type: array
          items:
            $ref: '#/components/schemas/HostOverlayPeerPath'
        overlayPeersObservedAt:
          type: [string, 'null']
          format: date-time
    NetworkProvider:
      type: object
      additionalProperties: false
      required: [id, capabilities]
      properties:
        id:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 100
        version:
          type: string
          maxLength: 40
        apiVersion:
          type: string
          maxLength: 80
        capabilities:
          type: array
          items:
            type: string
            maxLength: 80
        capabilityDetails:
          type: array
          items:
            $ref: '#/components/schemas/NetworkProviderCapability'
    NetworkProviderCapability:
      type: object
      additionalProperties: false
      required: [id, operations, layers, protocols]
      properties:
        id:
          type: string
          maxLength: 80
        operations:
          type: array
          items:
            type: string
            maxLength: 80
        layers:
          type: array
          items:
            $ref: '#/components/schemas/TopologyLayer'
        protocols:
          type: array
          items:
            $ref: '#/components/schemas/TopologyProtocol'
    ConfigTranslatorDescriptor:
      type: object
      additionalProperties: false
      required: [id, sourceFormats]
      properties:
        id:
          type: string
          maxLength: 80
        sourceFormats:
          type: array
          items:
            type: string
            maxLength: 80
    PluginStatus:
      type: object
      additionalProperties: false
      required: [id, version, state, providerIds, translatorIds]
      properties:
        id: {type: string, maxLength: 80}
        version: {type: string, maxLength: 40}
        state: {type: string, enum: [CREATED, DISABLED, RESOLVED, STARTED, STOPPED, FAILED, UNLOADED]}
        providerIds:
          type: array
          items: {type: string, maxLength: 80}
        translatorIds:
          type: array
          items: {type: string, maxLength: 80}
    ConfigTranslationRequest:
      type: object
      additionalProperties: false
      required: [sourceFormat, snapshot, targetFormat]
      properties:
        sourceFormat:
          type: string
          minLength: 1
          maxLength: 80
        snapshot:
          type: string
          maxLength: 1048576
        targetFormat:
          type: string
          minLength: 1
          maxLength: 80
    ConfigTranslationResult:
      type: object
      additionalProperties: false
      required: [snapshot, preservedFields, warnings]
      properties:
        snapshot:
          type: string
          maxLength: 1048576
        preservedFields:
          type: array
          items:
            type: string
            maxLength: 200
        warnings:
          type: array
          items:
            type: string
            maxLength: 500
    NetworkProviderPlanRequest:
      type: object
      additionalProperties: false
      required: [desiredSnapshot]
      properties:
        desiredSnapshot:
          type: string
          maxLength: 65536
          description: Provider-defined desired state encoded as JSON text.
        observedSnapshot:
          type: [string, 'null']
          maxLength: 65536
          description: Optional opaque observation token returned by this Provider's observe operation.
    NetworkProviderObservationRequest:
      type: object
      additionalProperties: false
      required: [resourceKey]
      properties:
        resourceKey:
          type: string
          minLength: 1
          maxLength: 253
          description: Provider-defined resource identifier; control characters are rejected.
    NetworkProviderObservation:
      type: object
      additionalProperties: false
      required: [providerId, resourceKey, snapshot]
      properties:
        providerId:
          type: string
        resourceKey:
          type: string
        snapshot:
          type: string
          maxLength: 65536
    NetworkProviderOperation:
      type: object
      additionalProperties: false
      required: [id, providerId, generation, state, detail, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          maxLength: 80
        generation:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum: [PLANNED, VALIDATED, APPLYING, APPLIED, VERIFIED, DRIFTED, COMPENSATING, COMPENSATED, UNKNOWN, FAILED]
        detail:
          type: string
          maxLength: 512
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    K3sInstallationCreateRequest:
      type: object
      additionalProperties: false
      required: [serverHostId, agentHostIds, targetVersion, serverUrl, token, reason]
      properties:
        serverHostId:
          type: string
          format: uuid
        agentHostIds:
          type: array
          uniqueItems: true
          maxItems: 99
          items:
            type: string
            format: uuid
        targetVersion:
          type: string
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$'
          maxLength: 32
        serverUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 512
          description: Agent 可访问的 K3s API HTTPS 地址。
        token:
          type: string
          pattern: '^[A-Za-z0-9_.:-]{16,512}$'
          writeOnly: true
          description: 仅接受短令牌；Core 使用 Kubernetes credential key 加密保存，不在读取 API 中返回。
        reason:
          type: string
          minLength: 1
          maxLength: 500
    K3sInstallationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/K3sInstallationPlan'
    K3sInstallationPlan:
      type: object
      additionalProperties: false
      required: [id, serverHostId, targetVersion, serverUrl, reason, state, activeOrdinal, clusterId, errorCode, errorMessage, requestedBy, createdAt, startedAt, finishedAt, steps]
      properties:
        id: { type: string, format: uuid }
        serverHostId: { type: string, format: uuid }
        targetVersion: { type: string }
        serverUrl: { type: string, format: uri }
        reason: { type: string }
        state:
          type: string
          enum: [DRAFT, RUNNING, AWAITING_CLUSTER_REGISTRATION, AWAITING_NODE_MAPPING, SUCCEEDED, FAILED, UNKNOWN]
        activeOrdinal: { type: integer, minimum: 0 }
        clusterId: { type: [string, 'null'], format: uuid }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        requestedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        steps:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/K3sInstallationStep'
    K3sInstallationStep:
      type: object
      additionalProperties: false
