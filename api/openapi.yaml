        siteName:
          type: string
          minLength: 1
          maxLength: 100
        defaultTimezone:
          type: string
          minLength: 1
          maxLength: 100
        hostOfflineAfterSeconds:
          type: integer
          minimum: 30
          maximum: 600
        operationRetentionDays:
          type: integer
          minimum: 7
          maximum: 365
      minProperties: 1
    AuditEvent:
