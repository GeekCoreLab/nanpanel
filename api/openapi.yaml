          minLength: 1
          maxLength: 255
          description: 初始资产名；Agent 首次心跳后以主机实测 hostname 更新。
    AgentEnrollmentCreated:
      type: object
      additionalProperties: false
      required: [enrollmentId, hostId, agentId, token, expiresAt, controllerFingerprint, gatewayPort, relayEndpoints, relayFallback]
      properties:
        enrollmentId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        token:
          type: string
          minLength: 40
          maxLength: 128
          description: 明文接入码仅在创建响应中返回；数据库只保存 SHA-256 哈希。
        expiresAt:
          type: string
          format: date-time
        controllerFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        gatewayPort:
          type: integer
          minimum: 1
          maximum: 65535
        relayEndpoints:
          type: array
          maxItems: 8
          items:
            type: string
            format: uri
            pattern: '^https://'
          description: 配置的 Control Relay HTTPS 源站；空数组表示仅使用直接 Gateway。
        relayFallback:
          $ref: '#/components/schemas/RelayFallbackManifest'
    RedeemAgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [csrPem]
      properties:
        csrPem:
          type: string
          minLength: 100
          maxLength: 16384
          description: Agent 本地生成的 PEM CSR，主题 CN 必须与登记的 Agent UUID 相同。
    AgentEnrollmentRedeemed:
      type: object
      additionalProperties: false
      required: [agentId, hostId, certificatePem]
      properties:
        agentId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        certificatePem:
          type: string
          description: 由 NaNPanel Agent CA 签发的客户端证书 PEM。
    AgentInstallation:
      type: object
      additionalProperties: false
      required: [controllerFingerprint, gatewayPort, relayEndpoints, relayFallback, installerPath, agentDownloadPath, helperDownloadPath]
      properties:
        controllerFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        gatewayPort:
          type: integer
        relayEndpoints:
          type: array
          maxItems: 8
          items:
            type: string
            format: uri
            pattern: '^https://'
        relayFallback:
          $ref: '#/components/schemas/RelayFallbackManifest'
        installerPath:
          type: string
        agentDownloadPath:
          type: string
        helperDownloadPath:
          type: string
    RelayFallbackManifest:
      type: object
      additionalProperties: false
      required: [endpoints, signature, publicKey]
      properties:
        endpoints:
          type: array
          maxItems: 8
          items:
            type: string
            format: uri
            pattern: '^https://'
          description: Root-configured fallback Relay origins signed over their normalized ordered list with Ed25519.
        signature:
          type: string
          pattern: '^(|[a-fA-F0-9]{128})$'
        publicKey:
          type: string
          pattern: '^(|[a-fA-F0-9]{64})$'
    AgentUpdateOperation:
      type: object
      additionalProperties: false
      required: [id, agentId, status, detail, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        detail:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Agent:
      type: object
      additionalProperties: false
      required:
      - id
      - hostId
      - version
      - implementation
      - status
      - lastSeenAt
      - capabilities
      - helperStatus
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        version:
          type:
          - string
          - 'null'
        implementation:
          type: string
          const: rust
        status:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
        helperStatus:
          type: string
          enum:
          - UNKNOWN
          - AVAILABLE
          - UNAVAILABLE
          description: 仅反映最近观测的 Helper 可用性，不替代每次操作的授权检查。
    SystemService:
      type: object
      additionalProperties: false
      required:
      - id
      - hostId
      - unitName
      - displayName
      - activeState
      - subState
      - generation
      - observedAt
      - supportedActions
      - observationStale
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        unitName:
          type: string
          pattern: ^[A-Za-z0-9_.@:\\-]+\.service$
          maxLength: 255
        displayName:
          type: string
          minLength: 1
        activeState:
          type: string
          enum:
          - UNKNOWN
          - ACTIVE
          - INACTIVE
          - ACTIVATING
          - DEACTIVATING
          - RELOADING
          - FAILED
        subState:
          type:
          - string
          - 'null'
        generation:
          type: integer
          format: int64
          minimum: 1
          description: 主机配置版本；观测状态更新不递增此值。版本变化会使旧 ETag 失效。
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
        supportedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - RESTART
            - READ_JOURNAL
          description: 根据 Agent 最近报告的主机级能力与观测新鲜度生成的 UI 提示；执行时仍会校验 Agent、Helper 和主机级能力。
        observationStale:
          type: boolean
          description: true 时仅为历史观测，不能表示当前实际状态。
    RestartServiceRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 审计用途，去除首尾空白后不得为空，不得包含密码或令牌。
        timeoutSeconds:
          type: integer
          minimum: 5
          maximum: 300
          default: 60
          description: 包含排队、执行与验证的总期限。截止时间由服务端在首次接受请求时计算，重试不延长。
    SystemdJournalRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 审计用途，去除首尾空白后不得为空。
    HostHelperOperationRequest:
      type: object
      additionalProperties: false
      required: [capability, target, reason, expectedGeneration]
      properties:
        capability:
          type: string
          enum:
          - package.install
          - file.write.protected
          - container.list
          - container.logs
          - container.start
          - container.stop
          - container.deploy
          - network.firewall.expose
          - k3s.preflight
          - k3s.install
          - k3s.upgrade
          - file.list
          - file.read
          - file.write
          - file.delete
        target:
          type: string
          maxLength: 4096
          description: 容器或网络操作的目标名；文件管理使用绝对主机路径。路径不得包含 .、.. 或符号链接组件；file.list 可访问 /，其他文件操作须指向普通文件。
        payload:
          oneOf:
          - $ref: '#/components/schemas/PackageInstallPayload'
          - $ref: '#/components/schemas/ProtectedFilePayload'
          - $ref: '#/components/schemas/HostFileWritePayload'
          - $ref: '#/components/schemas/ContainerDeployPayload'
          - $ref: '#/components/schemas/NetworkFirewallPayload'
          - $ref: '#/components/schemas/K3sPreflightPayload'
          - $ref: '#/components/schemas/K3sInstallPayload'
          - $ref: '#/components/schemas/K3sUpgradePayload'
          - type: 'null'
          description: 各类型化 Helper 操作接受对应参数对象。
        reason:
          type: string
          minLength: 1
          maxLength: 500
        timeoutSeconds:
          type: integer
          minimum: 5
          maximum: 600
          default: 60
        expectedGeneration:
          type: integer
          format: int64
          minimum: 1
          description: 来自主机详情快照；变化时拒绝执行并要求刷新。
    K3sPreflightPayload:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [server, agent]
          description: 按 K3s server 或 agent 节点最低资源要求执行只读校验。
    K3sInstallPayload:
      type: object
      additionalProperties: false
      required: [role, version, serverUrl, token]
      properties:
        role:
          type: string
          enum: [server, agent]
        version:
          type: string
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$'
          description: 固定的稳定 K3s 发布版本，不接受通道或 shell 参数。
        serverUrl:
          type: [string, 'null']
          maxLength: 512
          format: uri
          description: Agent 节点必填，Server 节点必须为 null；只接受 HTTPS 6443 API origin。
        token:
          type: string
          minLength: 16
          maxLength: 512
          pattern: '^[A-Za-z0-9_.:-]+$'
          writeOnly: true
          description: 仅在传输中使用，不写入操作结果、审计或日志。
    K3sUpgradePayload:
      type: object
      additionalProperties: false
      required: [role, version]
      properties:
        role:
          type: string
          enum: [server, agent]
        version:
          type: string
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$'
          description: 固定稳定 K3s 版本；仅允许同一 Kubernetes minor 或向前一个 minor 升级。
    SshProbeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SaveHostSshConfigRequest:
      type: object
      additionalProperties: false
      required: [address, port, username, authMethod]
      description: PASSWORD 时只提供 password；PRIVATE_KEY 时只提供 privateKey 和可选 privateKeyPassphrase。明文只用于本次 TLS 写入，不会进入响应。
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 253
          description: IPv4、IPv6 或 DNS 主机名，不包含用户名或 URL scheme。
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        username:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_.-]{0,127}$'
        authMethod:
          type: string
          enum: [PASSWORD, PRIVATE_KEY]
        password:
          type: [string, 'null']
          maxLength: 4096
        privateKey:
          type: [string, 'null']
          maxLength: 65536
        privateKeyPassphrase:
          type: [string, 'null']
          maxLength: 4096
    HostSshConfig:
      type: object
      additionalProperties: false
      required: [hostId, address, port, username, authMethod, credentialsConfigured, hostKeyFingerprint, probedFingerprint, probedAt]
      properties:
        hostId: { type: string, format: uuid }
        address: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        authMethod: { type: string, enum: [PASSWORD, PRIVATE_KEY] }
        credentialsConfigured: { type: boolean, const: true }
        hostKeyFingerprint: { type: [string, 'null'], pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        probedFingerprint: { type: [string, 'null'], pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        probedAt: { type: [string, 'null'], format: date-time }
    SshHostKeyProbeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    SshHostKeyProbe:
      type: object
      additionalProperties: false
      required: [hostId, fingerprint, matchesTrustedFingerprint, requiresConfirmation, probedAt]
      properties:
        hostId: { type: string, format: uuid }
        fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        matchesTrustedFingerprint: { type: boolean }
        requiresConfirmation: { type: boolean }
        probedAt: { type: string, format: date-time }
    SshHostKeyTrustRequest:
      type: object
      additionalProperties: false
      required: [fingerprint, reason]
      properties:
        fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CreateBastionSessionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        columns: { type: integer, minimum: 20, maximum: 500, default: 120 }
        rows: { type: integer, minimum: 5, maximum: 200, default: 36 }
    TerminateBastionSessionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    BastionSessionTicket:
      type: object
      additionalProperties: false
      required: [sessionId, ticket, expiresAt, websocketPath]
      properties:
        sessionId: { type: string, format: uuid }
        ticket:
          type: string
          minLength: 40
          maxLength: 128
          writeOnly: true
          description: 60 秒有效的一次性 WebSocket 票据；只允许短暂保存在浏览器内存。
        expiresAt: { type: string, format: date-time }
        websocketPath: { type: string, pattern: '^/api/v1/bastion-sessions/' }
    BastionSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BastionSession' }
    BastionSession:
      type: object
      additionalProperties: false
      required: [id, hostId, hostname, actorId, reason, targetAddress, targetPort, targetUsername, targetFingerprint, status, durationMs, bytesIn, bytesOut, failureCode, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        hostId: { type: string, format: uuid }
        hostname: { type: string }
        actorId: { type: string, format: uuid }
        reason: { type: string }
        targetAddress: { type: string }
        targetPort: { type: integer }
        targetUsername: { type: string }
        targetFingerprint: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, CLOSED, FAILED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        bytesIn: { type: integer, minimum: 0 }
        bytesOut: { type: integer, minimum: 0 }
        failureCode:
          type: [string, 'null']
          description: FORCE_TERMINATED 表示管理员已强制阻断该会话。
    BastionCommandList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BastionCommand' }
    BastionCommand:
      type: object
      additionalProperties: false
      required: [sequence, occurredAt, command]
      properties:
        sequence: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        command: { type: string, maxLength: 4096 }
    BastionRecordingList:
      type: object
      additionalProperties: false
      required: [items, encoding, format]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BastionRecordingChunk' }
        encoding: { type: string, const: base64 }
        format: { type: string, const: nanpanel-terminal-v1 }
    BastionRecordingChunk:
      type: object
      additionalProperties: false
      required: [sequence, offsetMs, direction, data]
      properties:
        sequence: { type: integer, minimum: 1 }
        offsetMs: { type: integer, minimum: 0 }
        direction: { type: string, enum: [INPUT, OUTPUT] }
        data: { type: string, contentEncoding: base64 }
    SshProbeResult:
      type: object
      additionalProperties: false
      required: [hostId, address, port, status, verifiedAt, evidence]
      properties:
        hostId:
          type: string
          format: uuid
        address:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        status:
          type: string
          const: SUCCEEDED
        verifiedAt:
          type: string
          format: date-time
        evidence:
          type: string
    SshSystemdRestartRequest:
      type: object
      additionalProperties: false
      required: [unitName, reason]
      properties:
        unitName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.@:-]{0,247}\.service$'
          description: Must be a valid systemd service unit name.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Audited operator reason; control characters are rejected.
    SshSystemdRestartResult:
      type: object
      additionalProperties: false
      required: [unitName, active, verifiedAt]
      properties:
        unitName:
          type: string
        active:
          type: boolean
          const: true
        verifiedAt:
          type: string
          format: date-time
    SshSystemdDiagnosticRequest:
      type: object
      additionalProperties: false
      required: [unitName, reason]
      properties:
        unitName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.@:-]{0,247}\.service$'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SshSystemdJournalRequest:
      type: object
      additionalProperties: false
      required: [unitName, reason, lines]
      properties:
        unitName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.@:-]{0,247}\.service$'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    SshSystemdStatusResult:
      type: object
      additionalProperties: false
      required: [hostId, unitName, loadState, activeState, subState, observedAt]
      properties:
        hostId: { type: string, format: uuid }
        unitName: { type: string }
        loadState: { type: string }
        activeState: { type: string }
        subState: { type: string }
        observedAt: { type: string, format: date-time }
    SshSystemdJournalResult:
      type: object
      additionalProperties: false
      required: [hostId, unitName, requestedLines, output, truncated, observedAt]
      properties:
        hostId: { type: string, format: uuid }
        unitName: { type: string }
        requestedLines: { type: integer, minimum: 1, maximum: 100 }
        output: { type: string, maxLength: 24576 }
        truncated: { type: boolean }
        observedAt: { type: string, format: date-time }
    SshAgentInstallResult:
      type: object
      additionalProperties: false
      required: [agentId, status, verifiedAt]
      properties:
        agentId:
          type: string
          format: uuid
        status:
          type: string
          const: ONLINE
        verifiedAt:
          type: string
          format: date-time
    SshAgentInstallRequest:
      type: object
      additionalProperties: false
      required: [enrollmentId, agentId, token, reason]
      properties:
        enrollmentId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        token:
          type: string
          minLength: 40
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]{40,128}$'
          description: 仅匹配数据库中的一次性 enrollment token 哈希；请求结束后不持久化。
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PackageInstallPayload:
      type: object
      additionalProperties: false
      required: [packages]
      properties:
        packages:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9+_.:-]{0,127}$'
    ProtectedFilePayload:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          maxLength: 32768
          description: UTF-8 文件内容；目标文件为 root-managed files 目录内的单层文件。
    HostFileWritePayload:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          maxLength: 32768
          description: UTF-8 文本文件内容，不能包含 NUL 字节。
    HostFileListing:
      type: object
      additionalProperties: false
      required: [path, entries, truncated]
      properties:
        path:
          type: string
          maxLength: 4096
        entries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/HostFileEntry'
        truncated:
          type: boolean
    HostFileEntry:
      type: object
      additionalProperties: false
      required: [name, kind, sizeBytes]
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum: [directory, file, symlink, other]
        sizeBytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
    ContainerDeployPayload:
      type: object
      additionalProperties: false
      required: [image, hostPort, containerPort]
      properties:
        image:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}$'
          description: 容器镜像；部署仍使用只读根文件系统、资源限制和 loopback 端口绑定。
        hostPort:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
          description: 可选 loopback 主机端口；需与 containerPort 同时设置或同时为空。
        containerPort:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
    NetworkFirewallPayload:
      type: object
      additionalProperties: false
      required: [interfaceName, protocol, port, rollbackSeconds]
      properties:
        interfaceName:
          type: string
          minLength: 1
          maxLength: 15
          pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,14}$'
          description: 防火墙规则绑定的主机网络接口。
        protocol:
          type: string
          enum: [tcp, udp]
        port:
          type: integer
          minimum: 1
          maximum: 65535
        rollbackSeconds:
          type: integer
          minimum: 30
          maximum: 300
          description: 网络规则自动回滚时间；Helper 在应用规则前先启动 systemd 回滚单元。
    OperationError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      - executionOutcome
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        executionOutcome:
          type: string
          enum:
          - NOT_EXECUTED
          - VERIFIED_FAILED
          - UNCERTAIN
          description: 是否执行与是否允许新建重试须分别判断；UNCERTAIN 不得自动重新执行。
    ServiceRestartResult:
      type: object
      additionalProperties: false
      required:
      - serviceId
      - unitName
      - activeState
      - verifiedAt
      - evidence
      properties:
        serviceId:
          type: string
          format: uuid
        unitName:
          type: string
          minLength: 1
        activeState:
          type: string
          const: ACTIVE
        verifiedAt:
          type: string
          format: date-time
        evidence:
          type: string
          minLength: 1
          description: 脱敏后的执行与验证摘要。ACTIVE 仅证明 systemd 服务状态，不证明 HTTP 或其他业务端到端健康。
    SystemdJournalReadResult:
      type: object
      additionalProperties: false
      required:
      - serviceId
      - unitName
      - journal
      - retrievedAt
      properties:
        serviceId:
          type: string
          format: uuid
        unitName:
          type: string
        journal:
          type: string
          maxLength: 2000
          description: 最多 12 行，并受 Agent 结果大小限制；内容可能含敏感数据，按管理员权限保护。
        retrievedAt:
          type: string
          format: date-time
    HostHelperOperationResult:
      type: object
      additionalProperties: false
      required: [capability, target, output, completedAt]
      properties:
        capability:
          type: string
        target:
          type: string
        output:
          type: string
          maxLength: 2000
          description: Bounded Helper output; package or container logs may include sensitive values.
        completedAt:
          type: string
          format: date-time
    Operation:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - hostId
      - agentId
      - serviceId
      - capability
      - target
      - idempotencyKey
      - requestedBy
      - reason
      - expectedGeneration
      - phase
      - status
      - createdAt
      - startedAt
      - updatedAt
      - deadlineAt
      - finishedAt
      - result
      - error
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - SYSTEM_SERVICE_RESTART
          - SYSTEMD_JOURNAL_READ
          - HOST_HELPER_OPERATION
          - SSH_SYSTEMD_RESTART
          - SSH_AGENT_INSTALL
        hostId:
          type: string
          format: uuid
        agentId:
          type:
          - string
          - 'null'
          format: uuid
        serviceId:
          type:
          - string
          - 'null'
          format: uuid
        capability:
          type:
          - string
          - 'null'
        target:
          type:
          - string
          - 'null'
        idempotencyKey:
          type: string
          minLength: 1
        requestedBy:
          type: string
          description: 从已认证主体取得，不接受客户端指定。
        reason:
          type: string
          minLength: 1
        expectedGeneration:
          type:
          - integer
          - 'null'
          minimum: 1
        phase:
          type: string
          enum:
          - VALIDATE
          - PREPARE
          - APPLY
          - VERIFY
          - COMMIT
          - COMPENSATE
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - UNKNOWN
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        result:
          oneOf:
          - $ref: '#/components/schemas/ServiceRestartResult'
          - $ref: '#/components/schemas/SystemdJournalReadResult'
          - $ref: '#/components/schemas/HostHelperOperationResult'
          - $ref: '#/components/schemas/SshSystemdRestartResult'
          - $ref: '#/components/schemas/SshAgentInstallResult'
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/OperationError'
          - type: 'null'
      description: 异步操作快照。SUCCEEDED 必须执行成功且验证通过；UNKNOWN 表示可能已执行但缺少可靠结果，禁止盲目重放。具体状态约束见 API README。CANCELLED 预留给执行前的系统取消，本版不提供取消端点。
      allOf:
      - if:
          properties:
            status:
              enum:
              - PENDING
              - RUNNING
        then:
          properties:
            result:
              type: 'null'
            error:
              type: 'null'
            finishedAt:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - PENDING
        then:
          properties:
            startedAt:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - SUCCEEDED
        then:
          properties:
            result:
              oneOf:
              - $ref: '#/components/schemas/ServiceRestartResult'
              - $ref: '#/components/schemas/SystemdJournalReadResult'
              - $ref: '#/components/schemas/HostHelperOperationResult'
              - $ref: '#/components/schemas/SshSystemdRestartResult'
              - $ref: '#/components/schemas/SshAgentInstallResult'
            error:
              type: 'null'
            finishedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - FAILED
        then:
          properties:
            result:
              type: 'null'
            error:
              $ref: '#/components/schemas/OperationError'
            finishedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - CANCELLED
        then:
          properties:
            result:
              type: 'null'
            error:
              type: 'null'
            finishedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - UNKNOWN
        then:
          properties:
            result:
              type: 'null'
            finishedAt:
              type: 'null'
            error:
              allOf:
              - $ref: '#/components/schemas/OperationError'
              - properties:
                  executionOutcome:
                    const: UNCERTAIN
                  retryable:
                    const: false
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
          description: 本版使用 about:blank。
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
                minLength: 1
              message:
                type: string
                minLength: 1
      description: 统一 HTTP 错误。业务执行失败放入 Operation.error，GET 任务仍返回 200。不得返回堆栈、机密或原始命令输出。
    HostPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        nextCursor:
          type:
          - string
          - 'null'
          description: null 表示无下一页；否则原样传入下一次请求，保持其他筛选参数不变。
    SystemServicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SystemService'
        nextCursor:
          type:
          - string
          - 'null'
          description: null 表示无下一页；否则原样传入下一次请求，保持其他筛选参数不变。
    OperationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        nextCursor:
          type:
          - string
          - 'null'
          description: null 表示无下一页；否则原样传入下一次请求，保持其他筛选参数不变。
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - displayName
      - roles
      - status
      - mustChangePassword
      - createdAt
      - updatedAt
      - lastLoginAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,63}$
          description: 创建后不可更改，按小写规范化后唯一。
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
    WebSession:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - current
      - createdAt
      - authenticatedAt
      - lastSeenAt
      - idleExpiresAt
      - absoluteExpiresAt
      - clientIp
      - userAgent
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        authenticatedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        clientIp:
          type:
          - string
          - 'null'
        userAgent:
          type:
          - string
          - 'null'
          maxLength: 512
      description: id 仅为可展示/撤销的会话资源标识，不是可用于认证的 Cookie 值。不得返回会话密钥或 Cookie。
    CsrfContext:
      type: object
      additionalProperties: false
      required:
      - csrfToken
      - expiresAt
      properties:
        csrfToken:
          type: string
          minLength: 32
          description: 绑定当前预认证/已认证会话，仅存内存，不是会话凭证。
        expiresAt:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes, expiresInDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [kubernetes:inventory:read, kubernetes:inventory:refresh]
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, name, scopes, createdAt, expiresAt, revokedAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [kubernetes:inventory:read, kubernetes:inventory:refresh]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
    ApiKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApiKey'
    CreatedApiKey:
      type: object
      additionalProperties: false
      required: [item, token]
      properties:
        item:
          $ref: '#/components/schemas/ApiKey'
        token:
          type: string
          pattern: '^npk_[0-9a-f-]{36}\.[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: 原始 API 密钥；仅在创建响应中返回一次。
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    SessionContext:
      type: object
      additionalProperties: false
      required:
      - user
      - session
      - permissions
      - csrfToken
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        session:
          $ref: '#/components/schemas/WebSession'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        csrfToken:
          type: string
          minLength: 32
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: 新密码：15–128 个 Unicode 字符，不截断，不记录日志；须通过服务端常见/泄露密码检查。
    CreateAdminUserRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - displayName
      - initialPassword
      properties:
        username:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        initialPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: 新密码：15–128 个 Unicode 字符，不截断，不记录日志；须通过服务端常见/泄露密码检查。
    UpdateAdminUserRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      minProperties: 1
    ResetAdminPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: 新密码：15–128 个 Unicode 字符，不截断，不记录日志；须通过服务端常见/泄露密码检查。
    BuiltinRole:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - permissions
      properties:
        id:
          type: string
          const: ADMIN
        name:
          type: string
          minLength: 1
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    PlatformSettings:
      type: object
      additionalProperties: false
      required:
      - siteName
      - defaultTimezone
