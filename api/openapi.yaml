openapi: 3.1.1
info:
  title: NaNPanel 管理 API
  version: 0.1.0-draft.2
  description: 契约优先的 Web 平台 API。管理操作使用 HttpOnly Cookie 会话和写请求 CSRF；Agent 使用独立的一次性接入码、客户端证书和 mTLS/gRPC。主机/Agent 查询、受控 Agent 注册接入、心跳回写及 Cookie 保护的 /system 已实现；systemd 服务和操作任务仍待实现。
  x-status: draft
servers:
- url: http://127.0.0.1:8080
  description: 本地 Core（认证、平台管理、inventory 查询与仪表盘统计已实现）。
security:
- cookieAuth: []
tags:
- name: System
  description: 主控基本信息
- name: Hosts
  description: 主机资产与管理通道状态
- name: Agents
  description: Rust Agent 会话与能力
- name: SystemServices
  description: 主机 systemd 服务管理
- name: Operations
  description: 持久化异步操作与结果
- name: Auth
  description: Web 登录、当前身份、密码与本人会话
- name: AdminOverview
  description: 管理仪表盘
- name: AdminUsers
  description: 平台管理员账号，首期仅内置 ADMIN 角色
- name: AdminRoles
  description: 只读内置角色与权限
- name: AdminSettings
  description: 非机密平台设置
- name: AdminAudit
  description: 只读脱敏审计
- name: Topology
  description: 拓扑期望草稿，不部署网络
paths:
  /api/v1/system:
    get:
      tags:
      - System
      operationId: getSystemInfo
      summary: 查询系统信息
      description: 使用有效 Cookie 会话，首次登录必须先修改初始密码。
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
              examples:
                scaffold:
                  value:
                    name: NaNPanel
                    version: 0.1.0-SNAPSHOT
                    stage: scaffold
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - cookieAuth: []
  /api/v1/hosts:
    get:
      tags:
      - Hosts
      operationId: listHosts
      summary: 列出主机
      description: 返回已注册主机，不触发扫描或 Agent 接入。无数据返回空 items；在线状态按最近 Agent 心跳和平台离线阈值计算，没有心跳为 UNKNOWN。分页游标与 status 筛选绑定。登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回 401 或 403
        PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPage'
              examples:
                online:
                  value:
                    items:
                    - id: 8b395d24-5d5d-4f27-b70b-293cd30da621
                      hostname: host-b
                      os: linux
                      arch: x86_64
                      status: ONLINE
                      capabilities:
                      - systemd.read
                      - systemd.restart
                      agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                      lastSeenAt: '2026-10-18T12:00:00Z'
                      createdAt: '2026-10-18T12:00:00Z'
                    nextCursor: null
                empty:
                  value:
                    items: []
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
  /api/v1/hosts/{hostId}:
    parameters:
    - $ref: '#/components/parameters/HostId'
    get:
      tags:
      - Hosts
      operationId: getHost
      summary: 查询主机详情
      description: 返回最近一次 Agent 心跳、主机能力与 Agent 绑定；OFFLINE 不意味着已有业务流量中断。登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回 401 或 403 PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
              examples:
                online:
                  value:
                    id: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    hostname: host-b
                    os: linux
                    arch: x86_64
                    status: ONLINE
                    capabilities:
                    - systemd.read
                    - systemd.restart
                    agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    lastSeenAt: '2026-10-18T12:00:00Z'
                    createdAt: '2026-10-18T12:00:00Z'
                offline:
                  value:
                    id: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    hostname: host-b
                    os: linux
                    arch: x86_64
                    status: OFFLINE
                    capabilities:
                    - systemd.read
                    - systemd.restart
                    agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    lastSeenAt: '2026-10-18T12:00:00Z'
                    createdAt: '2026-10-18T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/agents/{agentId}:
    parameters:
    - $ref: '#/components/parameters/AgentId'
    get:
      tags:
      - Agents
      operationId: getAgent
      summary: 查询 Agent 状态与能力
      description: 不返回证书私钥、注册码或凭据。状态按最近心跳和平台离线阈值计算；当前持久化模型没有 Helper 观测字段，因此 helperStatus 返回 UNKNOWN。初版不包含注册、吊销、升级和直接下发命令。登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回 401 或 403 PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              examples:
                online:
                  value:
                    id: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    version: 0.1.0
                    implementation: rust
                    status: ONLINE
                    lastSeenAt: '2026-10-18T12:00:00Z'
                    capabilities:
                    - systemd.read
                    - systemd.restart
                    helperStatus: AVAILABLE
                helperUnavailable:
                  value:
                    id: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    version: 0.1.0
                    implementation: rust
                    status: ONLINE
                    lastSeenAt: '2026-10-18T12:00:00Z'
                    capabilities:
                    - systemd.read
                    - systemd.restart
                    helperStatus: UNAVAILABLE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/hosts/{hostId}/services:
    parameters:
    - $ref: '#/components/parameters/HostId'
    get:
      tags:
      - SystemServices
      operationId: listSystemServices
      summary: 列出主机 systemd 服务
      description: 这里的 SystemService 是主机 systemd unit，不是领域模型中的逻辑 Service。读取 Core 已有观测，不在 GET 中触发远程执行；主机离线可返回 observationStale=true
        的历史结果。尚无观测返回空列表，不能据此断言主机没有服务。 登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回 401 或 403 PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: planned
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemServicePage'
              examples:
                observed:
                  value:
                    items:
                    - id: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                      hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                      unitName: nginx.service
                      displayName: Nginx
                      activeState: ACTIVE
                      subState: running
                      generation: 7
                      observedAt: '2026-10-18T12:00:00Z'
                      allowedActions:
                      - RESTART
                      observationStale: false
                    nextCursor: null
                empty:
                  value:
                    items: []
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /api/v1/hosts/{hostId}/services/{serviceId}:
    parameters:
    - $ref: '#/components/parameters/HostId'
    - $ref: '#/components/parameters/ServiceId'
    get:
      tags:
      - SystemServices
      operationId: getSystemService
      summary: 查询 systemd 服务详情
      description: 返回最近观测和平台配置版本。后续重启需将响应 ETag 原样传入 If-Match。此查询不接受任意 unit 名称或文件路径。 登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回
        401 或 403 PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: planned
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemService'
              examples:
                active:
                  value:
                    id: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    unitName: nginx.service
                    displayName: Nginx
                    activeState: ACTIVE
                    subState: running
                    generation: 7
                    observedAt: '2026-10-18T12:00:00Z'
                    allowedActions:
                    - RESTART
                    observationStale: false
                stale:
                  value:
                    id: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    unitName: nginx.service
                    displayName: Nginx
                    activeState: UNKNOWN
                    subState: null
                    generation: 7
                    observedAt: '2026-10-18T12:00:00Z'
                    allowedActions: []
                    observationStale: true
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/hosts/{hostId}/services/{serviceId}/restart:
    parameters:
    - $ref: '#/components/parameters/HostId'
    - $ref: '#/components/parameters/ServiceId'
    post:
      tags:
      - SystemServices
      operationId: restartSystemService
      summary: 提交服务重启任务
      description: 仅管理员且经 Core 授权的主体可操作。Core 将 UUID 映射为受管 unit，Rust Agent 经 root Helper 的本地授权执行，客户端不能传入 Shell、unit
        名称或 root 身份。先认证授权，再检查幂等记录；匹配重放不重复执行且不因原 ETag 变化或后来离线被拒绝。新任务检查版本、能力、Agent 会话及单服务在途操作互斥，通过后持久化操作与幂等记录再下发。202
        仅表示接受，不表示已重启或验证成功。接受后的断线、执行权限变化或 Helper 拒绝记录在 Operation 中。详细语义见 API README。 登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回
        401 或 403 PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: planned
      responses:
        '202':
          description: 新操作已接受，或重放仍未结束/结果未知的原操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              examples:
                accepted:
                  value:
                    id: 559903dd-6474-4cb1-a70d-3e0ade987442
                    kind: SYSTEM_SERVICE_RESTART
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    serviceId: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                    idempotencyKey: restart-nginx-20261018-001
                    requestedBy: admin
                    reason: 应用已审核的服务配置
                    expectedGeneration: 7
                    phase: VALIDATE
                    status: PENDING
                    createdAt: '2026-10-18T12:00:00Z'
                    startedAt: null
                    updatedAt: '2026-10-18T12:00:00Z'
                    deadlineAt: '2026-10-18T12:01:00Z'
                    finishedAt: null
                    result: null
                    error: null
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '200':
          description: 同一幂等请求重放已结束的原操作；不创建新任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              examples:
                replayedSucceeded:
                  value:
                    id: 559903dd-6474-4cb1-a70d-3e0ade987442
                    kind: SYSTEM_SERVICE_RESTART
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    serviceId: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                    idempotencyKey: restart-nginx-20261018-001
                    requestedBy: admin
                    reason: 应用已审核的服务配置
                    expectedGeneration: 7
                    phase: COMMIT
                    status: SUCCEEDED
                    createdAt: '2026-10-18T12:00:00Z'
                    startedAt: '2026-10-18T12:00:00Z'
                    updatedAt: '2026-10-18T12:00:03Z'
                    deadlineAt: '2026-10-18T12:01:00Z'
                    finishedAt: '2026-10-18T12:00:03Z'
                    result:
                      serviceId: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                      unitName: nginx.service
                      activeState: ACTIVE
                      verifiedAt: '2026-10-18T12:00:03Z'
                      evidence: Helper 报告重启成功，systemd 重新观测为 active/running。
                    error: null
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartServiceRequest'
            examples:
              restartNginx:
                value:
                  reason: 应用已审核的服务配置
                  timeoutSeconds: 60
      security:
      - cookieAuth: []
        csrfToken: []
  /api/v1/operations:
    get:
      tags:
      - Operations
      operationId: listOperations
      summary: 列出操作任务
      description: 仅返回当前主体有权查看的操作。按 UUID 升序分页，不承诺数据库快照；界面需要最近操作时可按返回字段自行展示，不依赖列表默认时间倒序。 登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回
        401 或 403 PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: planned
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
              examples:
                pending:
                  value:
                    items:
                    - id: 559903dd-6474-4cb1-a70d-3e0ade987442
                      kind: SYSTEM_SERVICE_RESTART
                      hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                      agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                      serviceId: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                      idempotencyKey: restart-nginx-20261018-001
                      requestedBy: admin
                      reason: 应用已审核的服务配置
                      expectedGeneration: 7
                      phase: VALIDATE
                      status: PENDING
                      createdAt: '2026-10-18T12:00:00Z'
                      startedAt: null
                      updatedAt: '2026-10-18T12:00:00Z'
                      deadlineAt: '2026-10-18T12:01:00Z'
                      finishedAt: null
                      result: null
                      error: null
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: hostId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - UNKNOWN
  /api/v1/operations/{operationId}:
    parameters:
    - $ref: '#/components/parameters/OperationId'
    get:
      tags:
      - Operations
      operationId: getOperation
      summary: 查询操作执行与验证结果
      description: 轮询建议间隔 2 秒。FAILED / UNKNOWN 仍返回 200，HTTP 成功不等于操作成功。SUCCEEDED / FAILED / CANCELLED 为终态；UNKNOWN
        等待 Agent 持久化执行记录对账，不得当成可安全重试的失败。 登录会话要求账号 ACTIVE 且已完成临时密码修改，否则返回 401 或 403 PASSWORD_CHANGE_REQUIRED。
      x-implementation-status: planned
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              examples:
                pending:
                  value:
                    id: 559903dd-6474-4cb1-a70d-3e0ade987442
                    kind: SYSTEM_SERVICE_RESTART
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    serviceId: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                    idempotencyKey: restart-nginx-20261018-001
                    requestedBy: admin
                    reason: 应用已审核的服务配置
                    expectedGeneration: 7
                    phase: VALIDATE
                    status: PENDING
                    createdAt: '2026-10-18T12:00:00Z'
                    startedAt: null
                    updatedAt: '2026-10-18T12:00:00Z'
                    deadlineAt: '2026-10-18T12:01:00Z'
                    finishedAt: null
                    result: null
                    error: null
                succeeded:
                  value:
                    id: 559903dd-6474-4cb1-a70d-3e0ade987442
                    kind: SYSTEM_SERVICE_RESTART
                    hostId: 8b395d24-5d5d-4f27-b70b-293cd30da621
                    agentId: dfc775e1-f656-4b7c-a1c7-5c5490bed367
                    serviceId: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                    idempotencyKey: restart-nginx-20261018-001
                    requestedBy: admin
                    reason: 应用已审核的服务配置
                    expectedGeneration: 7
                    phase: COMMIT
                    status: SUCCEEDED
                    createdAt: '2026-10-18T12:00:00Z'
                    startedAt: '2026-10-18T12:00:00Z'
                    updatedAt: '2026-10-18T12:00:03Z'
                    deadlineAt: '2026-10-18T12:01:00Z'
                    finishedAt: '2026-10-18T12:00:03Z'
                    result:
                      serviceId: 6c0f837a-2fd9-4db8-9e87-c31d765c5bf1
                      unitName: nginx.service
                      activeState: ACTIVE
                      verifiedAt: '2026-10-18T12:00:03Z'
                      evidence: Helper 报告重启成功，systemd 重新观测为 active/running。
                    error: null
                helperDenied:
                  value:
                    id: 559903dd-6474-4cb1-a70d-3e0ade987442
                    kind: SYSTEM_SERVICE_RESTART
