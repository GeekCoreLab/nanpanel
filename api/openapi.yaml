      - operationRetentionDays
      - updatedAt
      - updatedBy
      properties:
        siteName:
          type: string
          minLength: 1
          maxLength: 100
        defaultTimezone:
          type: string
          minLength: 1
          maxLength: 100
          description: 有效 IANA 时区名，默认仅用于 UI 展示；所有 API 时间戳为 RFC 3339。
        hostOfflineAfterSeconds:
          type: integer
          minimum: 30
          maximum: 600
        operationRetentionDays:
          type: integer
          minimum: 7
          maximum: 365
          description: 仅适用于已结束操作，非终态和 UNKNOWN 不得因保留期清理。
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    UpdatePlatformSettingsRequest:
      type: object
      additionalProperties: false
      required: []
