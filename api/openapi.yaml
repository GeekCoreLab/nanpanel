      description: 映射按 ClusterNode UID 保存并审计；同一 Host 不能映射到多个集群节点。映射不会安装 Agent、删除 Host 或修改 Kubernetes Node；已映射节点的容器操作由 Kubernetes/Kubelet 所有，Host Agent 仍可执行 OS 与网络诊断。
