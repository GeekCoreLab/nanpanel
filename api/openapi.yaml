components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 仅供当前脚手架 GET /api/v1/system 兼容；不是 Web 登录方案。其余规划接口不接受 Basic 作为会话替代。
    cookieAuth:
      type: apiKey
      in: cookie
      name: nanpanel_session
      description: 服务端保存的随机不透明会话；Secure、HttpOnly、SameSite=Lax、Path=/，不设置 Domain。生产仅 HTTPS；具体预认证/登录/续期语义见 API README。
    preAuthCookie:
      type: apiKey
      in: cookie
      name: nanpanel_session
      description: GET /auth/csrf 签发的短期预认证 Cookie，不能访问管理资源；登录时必须与 CSRF token 配对。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 与 Cookie 绑定的同步 CSRF token；所有 POST/PUT/PATCH/DELETE 都要求验证，登录也不例外。
    agentEnrollmentToken:
      type: http
      scheme: bearer
      description: 15 分钟有效且只能兑换一次的安装器接入码，不用于浏览器管理会话。
  parameters:
    HostId:
      name: hostId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 平台分配的资源 UUID，不是主机名、unit 名称或系统 PID。
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 按资源 UUID 升序游标分页。
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: 不透明游标，与调用者授权范围和筛选条件绑定。无效或筛选不匹配返回 400。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: 调用者为一次逻辑操作生成的唯一键。按认证主体 + HTTP 方法 + 规范化路径 + 此键去重；规范化请求体和 If-Match 必须一致。任务及去重记录保留至少 7 天，非终态记录不得提前删除。
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[A-Za-z0-9._:-]{1,200}"$
        examples:
        - '"svc7-obs42-admin"'
      description: 服务详情返回的不透明强 ETag（带双引号）；标识当前调用者可见的完整表示，观测或权限提示变化也会使其改变，不接受通配符或多个值。新任务版本过期返回 412，缺失返回 428；同一幂等请求重放优先匹配原记录。
    ResourceIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[A-Za-z0-9._:-]{1,200}"$
        examples:
        - '"user-v3-admin"'
      description: 对应资源详情的强 ETag。与当前完整表示比较；缺失 428、过期 412，不允许 * 或多个 ETag。
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditEventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: 当前调用者可见的完整资源表示对应的不透明强 ETag；服务、用户与设置均独立生成，不等同于 generation。
      schema:
        type: string
        examples:
        - '"svc7-obs42-admin"'
    Location:
      description: 操作资源的相对 URI。
      schema:
        type: string
        format: uri-reference
        examples:
        - /api/v1/operations/559903dd-6474-4cb1-a70d-3e0ade987442
    RetryAfter:
      description: 建议下次轮询/重试等待的秒数。
      schema:
        type: integer
        minimum: 1
        examples:
        - 2
    IdempotencyReplayed:
      description: true 表示返回原操作，没有再次执行。
      schema:
        type: boolean
    SessionCookie:
      description: 签发/轮换 HttpOnly Cookie；退出时以相同 Path/属性置空并设 Max-Age=0。仅示意，不是真实凭据。
      schema:
        type: string
        examples:
        - nanpanel_session=example-not-a-real-session; Path=/; Secure; HttpOnly; SameSite=Lax
    NoStore:
      description: 认证和管理响应不缓存。
      schema:
        type: string
        const: no-store
  schemas:
    TopologyNodeKind:
      type: string
      enum:
      - GATEWAY
      - HOST
      - SERVICE
      - SWITCH
      - MERGE
      - SPLIT
      - FORWARDER
    TopologyPosition:
      type: object
      additionalProperties: false
      required:
      - x
      - y
      properties:
        x:
          type: number
          minimum: -10000
          maximum: 10000
        y:
          type: number
          minimum: -10000
          maximum: 10000
    TopologyNode:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - position
      - inputCount
      - outputCount
      properties:
        id: &id001
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TopologyNodeKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        position:
          $ref: '#/components/schemas/TopologyPosition'
        inputCount:
          type: integer
          minimum: 0
          maximum: 16
        outputCount:
          type: integer
          minimum: 0
          maximum: 16
    TopologyLink:
      type: object
      additionalProperties: false
      required:
      - id
      - sourceNodeId
      - sourcePort
      - targetNodeId
      - targetPort
      - status
      properties:
        id: *id001
        sourceNodeId: *id001
        sourcePort:
          type: string
          pattern: ^out-([1-9]|1[0-6])$
        targetNodeId: *id001
        targetPort:
          type: string
          pattern: ^in-([1-9]|1[0-6])$
        status:
          type: string
          const: UNVERIFIED
    TopologyDraftWrite:
      type: object
      additionalProperties: false
      required:
      - nodes
      - links
      properties:
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TopologyNode'
        links:
          type: array
          maxItems: 800
          items:
            $ref: '#/components/schemas/TopologyLink'
    TopologyDraft:
      type: object
      additionalProperties: false
      required:
      - nodes
      - links
      - updatedAt
      - updatedBy
      properties:
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TopologyNode'
        links:
          type: array
          maxItems: 800
          items:
            $ref: '#/components/schemas/TopologyLink'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type:
          - string
          - 'null'
          format: uuid
    SystemInfo:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - stage
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        stage:
          type: string
          minLength: 1
    Host:
      type: object
      additionalProperties: false
      required:
      - id
      - hostname
      - os
      - arch
      - status
      - capabilities
      - agentId
      - lastSeenAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
          minLength: 1
        os:
          type:
          - string
          - 'null'
        arch:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
          description: Agent 管理通道状态，不表示业务数据面健康。
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
        agentId:
          type:
          - string
          - 'null'
          format: uuid
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateAgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 255
          description: 初始资产名；Agent 首次心跳后以主机实测 hostname 更新。
    AgentEnrollmentCreated:
      type: object
      additionalProperties: false
      required: [enrollmentId, hostId, agentId, token, expiresAt, controllerFingerprint, gatewayPort]
      properties:
        enrollmentId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        token:
          type: string
          minLength: 40
          maxLength: 128
          description: 明文接入码仅在创建响应中返回；数据库只保存 SHA-256 哈希。
        expiresAt:
          type: string
          format: date-time
        controllerFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        gatewayPort:
          type: integer
          minimum: 1
          maximum: 65535
    RedeemAgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [csrPem]
      properties:
        csrPem:
          type: string
          minLength: 100
          maxLength: 16384
          description: Agent 本地生成的 PEM CSR，主题 CN 必须与登记的 Agent UUID 相同。
    AgentEnrollmentRedeemed:
      type: object
      additionalProperties: false
      required: [agentId, hostId, certificatePem]
      properties:
        agentId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        certificatePem:
          type: string
          description: 由 NaNPanel Agent CA 签发的客户端证书 PEM。
    AgentInstallation:
      type: object
      additionalProperties: false
      required: [controllerFingerprint, gatewayPort, installerPath, agentDownloadPath]
      properties:
        controllerFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        gatewayPort:
          type: integer
        installerPath:
          type: string
        agentDownloadPath:
          type: string
    Agent:
      type: object
      additionalProperties: false
      required:
      - id
      - hostId
      - version
      - implementation
      - status
      - lastSeenAt
      - capabilities
      - helperStatus
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        version:
          type:
          - string
          - 'null'
        implementation:
          type: string
          const: rust
        status:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        capabilities:
          type: array
          items:
            type: string
            minLength: 1
        helperStatus:
          type: string
          enum:
          - UNKNOWN
          - AVAILABLE
          - UNAVAILABLE
          description: 仅反映最近观测的 Helper 可用性，不替代每次操作的授权检查。
    SystemService:
      type: object
      additionalProperties: false
      required:
      - id
      - hostId
      - unitName
      - displayName
      - activeState
      - subState
      - generation
      - observedAt
      - allowedActions
      - observationStale
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        unitName:
          type: string
          pattern: ^[A-Za-z0-9_.@:\\-]+\.service$
          maxLength: 255
        displayName:
          type: string
          minLength: 1
        activeState:
          type: string
          enum:
          - UNKNOWN
          - ACTIVE
          - INACTIVE
          - ACTIVATING
          - DEACTIVATING
          - RELOADING
          - FAILED
        subState:
          type:
          - string
          - 'null'
        generation:
          type: integer
          format: int64
          minimum: 1
          description: 平台管理配置/权限策略版本；观测状态更新不递增此值。服务重建或授权策略变更须使旧 ETag 失效。
        observedAt:
          type:
          - string
          - 'null'
          format: date-time
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - RESTART
          description: 结合调用者权限与最近能力信息的 UI 提示；执行时必须重新授权。
        observationStale:
          type: boolean
          description: true 时仅为历史观测，不能表示当前实际状态。
    RestartServiceRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 审计用途，去除首尾空白后不得为空，不得包含密码或令牌。
        timeoutSeconds:
          type: integer
          minimum: 5
          maximum: 300
          default: 60
          description: 包含排队、执行与验证的总期限。截止时间由服务端在首次接受请求时计算，重试不延长。
    OperationError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      - executionOutcome
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        executionOutcome:
          type: string
          enum:
          - NOT_EXECUTED
          - VERIFIED_FAILED
          - UNCERTAIN
          description: 是否执行与是否允许新建重试须分别判断；UNCERTAIN 不得自动重新执行。
    ServiceRestartResult:
      type: object
      additionalProperties: false
      required:
      - serviceId
      - unitName
      - activeState
      - verifiedAt
      - evidence
      properties:
        serviceId:
          type: string
          format: uuid
        unitName:
          type: string
          minLength: 1
        activeState:
          type: string
          const: ACTIVE
        verifiedAt:
          type: string
          format: date-time
        evidence:
          type: string
          minLength: 1
          description: 脱敏后的执行与验证摘要。ACTIVE 仅证明 systemd 服务状态，不证明 HTTP 或其他业务端到端健康。
    Operation:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - hostId
      - agentId
      - serviceId
      - idempotencyKey
      - requestedBy
      - reason
      - expectedGeneration
      - phase
      - status
      - createdAt
      - startedAt
      - updatedAt
      - deadlineAt
      - finishedAt
      - result
      - error
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          const: SYSTEM_SERVICE_RESTART
        hostId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          minLength: 1
        requestedBy:
          type: string
          description: 从已认证主体取得，不接受客户端指定。
        reason:
          type: string
          minLength: 1
        expectedGeneration:
          type: integer
          minimum: 1
        phase:
          type: string
          enum:
          - VALIDATE
          - PREPARE
          - APPLY
          - VERIFY
          - COMMIT
          - COMPENSATE
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - UNKNOWN
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        result:
          oneOf:
          - $ref: '#/components/schemas/ServiceRestartResult'
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/OperationError'
          - type: 'null'
      description: 异步操作快照。SUCCEEDED 必须执行成功且验证通过；UNKNOWN 表示可能已执行但缺少可靠结果，禁止盲目重放。具体状态约束见 API README。CANCELLED 预留给执行前的系统取消，本版不提供取消端点。
      allOf:
      - if:
          properties:
            status:
              enum:
              - PENDING
              - RUNNING
        then:
          properties:
            result:
              type: 'null'
            error:
              type: 'null'
            finishedAt:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - PENDING
        then:
          properties:
            startedAt:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - SUCCEEDED
        then:
          properties:
            result:
              $ref: '#/components/schemas/ServiceRestartResult'
            error:
              type: 'null'
            finishedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - FAILED
        then:
          properties:
            result:
              type: 'null'
            error:
              $ref: '#/components/schemas/OperationError'
            finishedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - CANCELLED
        then:
          properties:
            result:
              type: 'null'
            error:
              type: 'null'
            finishedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - UNKNOWN
        then:
          properties:
            result:
              type: 'null'
            finishedAt:
              type: 'null'
            error:
              allOf:
              - $ref: '#/components/schemas/OperationError'
              - properties:
                  executionOutcome:
                    const: UNCERTAIN
                  retryable:
                    const: false
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
          description: 本版使用 about:blank。
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
                minLength: 1
              message:
                type: string
                minLength: 1
      description: 统一 HTTP 错误。业务执行失败放入 Operation.error，GET 任务仍返回 200。不得返回堆栈、机密或原始命令输出。
    HostPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        nextCursor:
          type:
          - string
          - 'null'
          description: null 表示无下一页；否则原样传入下一次请求，保持其他筛选参数不变。
    SystemServicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SystemService'
        nextCursor:
          type:
          - string
          - 'null'
          description: null 表示无下一页；否则原样传入下一次请求，保持其他筛选参数不变。
    OperationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        nextCursor:
          type:
          - string
          - 'null'
          description: null 表示无下一页；否则原样传入下一次请求，保持其他筛选参数不变。
    AdminUser:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - displayName
      - roles
      - status
      - mustChangePassword
      - createdAt
      - updatedAt
      - lastLoginAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,63}$
          description: 创建后不可更改，按小写规范化后唯一。
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
    WebSession:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - current
      - createdAt
      - authenticatedAt
      - lastSeenAt
      - idleExpiresAt
      - absoluteExpiresAt
      - clientIp
      - userAgent
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        authenticatedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        clientIp:
          type:
          - string
          - 'null'
        userAgent:
          type:
          - string
          - 'null'
          maxLength: 512
      description: id 仅为可展示/撤销的会话资源标识，不是可用于认证的 Cookie 值。不得返回会话密钥或 Cookie。
    CsrfContext:
      type: object
      additionalProperties: false
      required:
      - csrfToken
      - expiresAt
      properties:
        csrfToken:
          type: string
          minLength: 32
          description: 绑定当前预认证/已认证会话，仅存内存，不是会话凭证。
        expiresAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    SessionContext:
      type: object
      additionalProperties: false
      required:
      - user
      - session
      - permissions
      - csrfToken
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        session:
          $ref: '#/components/schemas/WebSession'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        csrfToken:
          type: string
          minLength: 32
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: 新密码：15–128 个 Unicode 字符，不截断，不记录日志；须通过服务端常见/泄露密码检查。
    CreateAdminUserRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - displayName
      - initialPassword
      properties:
        username:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        initialPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: 新密码：15–128 个 Unicode 字符，不截断，不记录日志；须通过服务端常见/泄露密码检查。
    UpdateAdminUserRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      minProperties: 1
    ResetAdminPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: 新密码：15–128 个 Unicode 字符，不截断，不记录日志；须通过服务端常见/泄露密码检查。
    BuiltinRole:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - permissions
      properties:
        id:
          type: string
          const: ADMIN
        name:
          type: string
          minLength: 1
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    PlatformSettings:
      type: object
      additionalProperties: false
      required:
      - siteName
      - defaultTimezone
      - hostOfflineAfterSeconds
      - operationRetentionDays
      - updatedAt
      - updatedBy
      properties:
        siteName:
          type: string
          minLength: 1
          maxLength: 100
        defaultTimezone:
          type: string
          minLength: 1
          maxLength: 100
          description: 有效 IANA 时区名，默认仅用于 UI 展示；所有 API 时间戳为 RFC 3339。
        hostOfflineAfterSeconds:
          type: integer
          minimum: 30
          maximum: 600
        operationRetentionDays:
          type: integer
          minimum: 7
          maximum: 365
          description: 仅适用于已结束操作，非终态和 UNKNOWN 不得因保留期清理。
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
    UpdatePlatformSettingsRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        siteName:
          type: string
          minLength: 1
          maxLength: 100
        defaultTimezone:
          type: string
          minLength: 1
          maxLength: 100
        hostOfflineAfterSeconds:
          type: integer
          minimum: 30
          maximum: 600
        operationRetentionDays:
          type: integer
          minimum: 7
          maximum: 365
      minProperties: 1
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - occurredAt
      - actorId
      - action
      - resourceType
      - resourceId
      - outcome
      - traceId
      - clientIp
      - summary
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        action:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1
        resourceId:
          type:
          - string
          - 'null'
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - DENIED
          - FAILED
        traceId:
          type: string
          minLength: 1
        clientIp:
          type:
          - string
          - 'null'
        summary:
          type: string
          minLength: 1
    AdminOverview:
      type: object
      additionalProperties: false
      required:
      - observedAt
      - hosts
      - operations
      - activeAdminUsers
      properties:
        observedAt:
          type: string
          format: date-time
        hosts:
          type: object
          additionalProperties: false
          required:
          - total
          - online
          - offline
          - unknown
          properties:
            total:
              type: integer
              minimum: 0
            online:
              type: integer
              minimum: 0
            offline:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
        operations:
          type: object
          additionalProperties: false
          required:
          - pending
          - running
          - unknown
          - failedLast24Hours
          properties:
            pending:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
            failedLast24Hours:
              type: integer
              minimum: 0
        activeAdminUsers:
          type: integer
          minimum: 1
    AdminUserPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextCursor:
          type:
          - string
          - 'null'
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type:
          - string
          - 'null'
    WebSessionList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebSession'
    BuiltinRoleList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinRole'
  responses:
    BadRequest:
      description: 路径、查询参数、请求头或请求体无效。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 请求格式错误
            status: 400
            detail: 路径、查询参数、请求头或请求体无效。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: INVALID_REQUEST
            traceId: example-trace-001
    Unauthorized:
      description: 缺少有效登录会话、会话已过期/撤销，或登录凭据无效；不返回 Basic challenge。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 需要认证
            status: 401
            detail: 缺少有效登录会话或登录凭据无效。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: UNAUTHENTICATED
            traceId: example-trace-001
    Forbidden:
      description: 主体无操作权限，或服务不在允许管理的范围。 Web 管理接口也可能返回 PASSWORD_CHANGE_REQUIRED 或 REAUTHENTICATION_REQUIRED；写操作还可能返回
        CSRF_INVALID。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 权限不足
            status: 403
            detail: 主体无操作权限，或服务不在允许管理的范围。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: PERMISSION_DENIED
            traceId: example-trace-001
    NotFound:
      description: 资源不存在或不属于指定主机。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 资源不存在
            status: 404
            detail: 资源不存在或不属于指定主机。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: RESOURCE_NOT_FOUND
            traceId: example-trace-001
    Conflict:
      description: 目标服务已有未结束或执行结果未知的操作；也可能为幂等键请求不一致（IDEMPOTENCY_KEY_REUSED）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 操作冲突
            status: 409
            detail: 目标服务已有未结束或执行结果未知的操作；也可能为幂等键请求不一致（IDEMPOTENCY_KEY_REUSED）。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: OPERATION_IN_PROGRESS
            traceId: example-trace-001
    PreconditionFailed:
      description: If-Match 已过期，请刷新对应资源详情后重新确认变更。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 资源版本已变化
            status: 412
            detail: If-Match 已过期，请刷新对应资源详情后重新确认变更。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: GENERATION_MISMATCH
            traceId: example-trace-001
    PreconditionRequired:
      description: 更新操作必须提供对应详情的 If-Match。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 缺少版本前置条件
            status: 428
            detail: 更新操作必须提供对应详情的 If-Match。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: PRECONDITION_REQUIRED
            traceId: example-trace-001
    UnsupportedMediaType:
      description: 请求体必须为 application/json。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 不支持的媒体类型
            status: 415
            detail: 请求体必须为 application/json。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: UNSUPPORTED_MEDIA_TYPE
            traceId: example-trace-001
    Unprocessable:
      description: Agent 不支持 systemd.restart，或主机未提供 systemd 服务管理。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 能力不支持
            status: 422
            detail: Agent 不支持 systemd.restart，或主机未提供 systemd 服务管理。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: CAPABILITY_UNSUPPORTED
            traceId: example-trace-001
    Unavailable:
      description: Agent 离线、无可用会话，或已知 Helper 不可用；不创建新任务。 若请求结果因连接中断未知，应使用相同幂等键重试以找回可能已接受的任务。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 执行端不可用
            status: 503
            detail: Agent 离线、无可用会话，或已知 Helper 不可用；不创建新任务。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: AGENT_UNAVAILABLE
            traceId: example-trace-001
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    InternalError:
      description: 控制面发生内部错误；请依据 traceId 排查。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 服务端错误
            status: 500
            detail: 控制面发生内部错误；请依据 traceId 排查。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: INTERNAL_ERROR
            traceId: example-trace-001
    LegacyBasicUnauthorized:
      description: 缺少凭据或凭据无效。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 需要认证
            status: 401
            detail: 缺少凭据或凭据无效。
            instance: /api/v1/hosts/8b395d24-5d5d-4f27-b70b-293cd30da621/services/6c0f837a-2fd9-4db8-9e87-c31d765c5bf1/restart
            code: UNAUTHENTICATED
            traceId: example-trace-001
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples:
            - Basic realm="NaNPanel"
    CsrfRejected:
      description: CSRF token 缺失/无效或 Origin 不在明确允许的 Web 来源内；不执行操作。 已认证请求还可能返回 PERMISSION_DENIED、PASSWORD_CHANGE_REQUIRED
        或 REAUTHENTICATION_REQUIRED；具体以 Problem.code 区分。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 请求未通过安全校验
            status: 403
            detail: CSRF token 缺失/无效或 Origin 不在明确允许的 Web 来源内；不执行操作。
            instance: /api/v1/auth/login
            code: CSRF_INVALID
            traceId: example-web-trace-001
    RecentAuthRequired:
      description: 敏感管理操作要求 5 分钟内的密码认证；重新登录后刷新 ETag 再提交。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 需要重新验证身份
            status: 403
            detail: 敏感管理操作要求 5 分钟内的密码认证；重新登录后刷新 ETag 再提交。
            instance: /api/v1/auth/login
            code: REAUTHENTICATION_REQUIRED
            traceId: example-web-trace-001
    PasswordChangeRequired:
      description: 临时密码会话只能访问 /auth/*，修改密码后才能管理资源。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 需要修改密码
            status: 403
            detail: 临时密码会话只能访问 /auth/*，修改密码后才能管理资源。
            instance: /api/v1/auth/login
            code: PASSWORD_CHANGE_REQUIRED
            traceId: example-web-trace-001
    AdminConflict:
      description: 用户名已存在、试图禁用自己或最后一个启用管理员，或请求与现有状态冲突。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 管理变更冲突
            status: 409
            detail: 用户名已存在、试图禁用自己或最后一个启用管理员，或请求与现有状态冲突。
            instance: /api/v1/auth/login
            code: ADMIN_STATE_CONFLICT
            traceId: example-web-trace-001
    PasswordRejected:
      description: 密码不能与当前密码相同，且须通过长度及常见/泄露密码检查。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 密码不符合策略
            status: 422
            detail: 密码不能与当前密码相同，且须通过长度及常见/泄露密码检查。
            instance: /api/v1/auth/login
            code: PASSWORD_POLICY_VIOLATION
            traceId: example-web-trace-001
    RateLimited:
      description: 超过登录或敏感操作限额，请稍后重试。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 请求过于频繁
            status: 429
            detail: 超过登录或敏感操作限额，请稍后重试。
            instance: /api/v1/auth/login
            code: RATE_LIMITED
            traceId: example-web-trace-001
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    InvalidCredentials:
      description: 用户名或密码错误，或账号无法登录；不区分账号不存在、禁用和密码错误。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: 无法登录
            status: 401
            detail: 用户名或密码错误，或账号无法登录；不区分账号不存在、禁用和密码错误。
            instance: /api/v1/auth/login
            code: INVALID_CREDENTIALS
            traceId: example-web-trace-001
