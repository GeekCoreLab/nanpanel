quarkus.application.name=nanpanel
quarkus.http.host=0.0.0.0
nanpanel.auth.bootstrap-password=${NANPANEL_ADMIN_PASSWORD:}
nanpanel.auth.origin=${NANPANEL_ORIGIN:https://localhost}
nanpanel.auth.secure-cookie=true
%dev.nanpanel.auth.origin=http://127.0.0.1:5173
%dev.nanpanel.auth.secure-cookie=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:nanpanel}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/nanpanel}
quarkus.datasource.devservices.enabled=false
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.migrate-at-start=true
nanpanel.agent.ca-cert=${NANPANEL_AGENT_CA_CERT:/etc/nanpanel/agent-ca/ca.crt}
nanpanel.agent.ca-key=${NANPANEL_AGENT_CA_KEY:/etc/nanpanel/agent-ca/ca.key}
nanpanel.agent.serving-cert=${NANPANEL_AGENT_SERVING_CERT:/etc/nanpanel/agent-serving/tls.crt}
nanpanel.agent.binary=${NANPANEL_AGENT_BINARY:/work/nanpanel-agent}
nanpanel.agent.gateway-token=${NANPANEL_AGENT_GATEWAY_TOKEN:}
nanpanel.agent.gateway-port=${NANPANEL_AGENT_GATEWAY_PORT:30444}
nanpanel.agent.gateway-control-url=${NANPANEL_AGENT_GATEWAY_CONTROL_URL:http://127.0.0.1:50052/control}
nanpanel.agent.enrollment-validity-seconds=${NANPANEL_AGENT_ENROLLMENT_VALIDITY_SECONDS:900}
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=test
%test.nanpanel.auth.bootstrap-password=test-only-password
%test.nanpanel.auth.origin=http://localhost:8081
%test.nanpanel.auth.secure-cookie=false

%test.quarkus.liquibase.change-log=auth-test-changelog.xml
%test.nanpanel.agent.ca-cert=src/test/resources/agent-test-ca.crt
%test.nanpanel.agent.ca-key=src/test/resources/agent-test-ca.key
%test.nanpanel.agent.serving-cert=src/test/resources/agent-test-ca.crt
%test.nanpanel.agent.binary=src/test/resources/agent-test-binary
%test.nanpanel.agent.gateway-token=test-gateway-token
